# Release only the exact package tag on current main. Candidate verification
# (including the installed-package test), pack, and smoke execution stay in a read-only job. The protected job receives
# one digest-bound tarball and runs no Scanner package code. npm authentication
# is OIDC-only through Trusted Publishing; token credentials are rejected at the
# final publication boundary.
#
# Required @aihq/scan Trusted Publisher config (npmjs.com): repository
# samartomar/aih-scan, workflow .github/workflows/release.yml, environment
# npm-publish, allowed action npm publish. RELEASING.md defines the owner gate.
name: release

on:
  push:
    tags:
      - "v0.1.0"
      - "v-scan-*"

permissions:
  contents: read

jobs:
  verify-and-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      tarball_sha256: ${{ steps.pack.outputs.tarball_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_sha256: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert tag commit is current main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "::error::tag commit $GITHUB_SHA does not match origin/main ($main_sha)"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Assert package version matches the tag
        run: |
          set -euo pipefail
          ver="$(node -p "require('./package.json').version")"
          expected_tag="v-scan-$ver"
          if [ "$ver" = "0.1.0" ]; then
            expected_tag="v0.1.0"
          fi
          if [ "$GITHUB_REF" != "refs/tags/$expected_tag" ]; then
            echo "::error::package version $ver requires refs/tags/$expected_tag"
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - name: Check and build the tagged source
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm run build
          npm run verify:workflow-action-pins
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
      - name: Provision the locked SkillSpector and Cisco runtimes outside PATH
        run: bash tools/analyzers/provision-test-runtimes.sh
      - name: Pack exact release tarball and checksum
        id: pack
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json > npm-pack.json
          tarball="$(node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync("npm-pack.json","utf8")); if(value.length!==1||typeof value[0]?.filename!=="string") process.exit(1); process.stdout.write(value[0].filename)')"
          ver="$(node -p "require('./package.json').version")"
          test "$tarball" = "aihq-scan-$ver.tgz"
          test -f "$tarball"
          tarball_sha256="$(sha256sum "$tarball" | awk '{print $1}')"
          if ! [[ "$tarball_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::invalid tarball SHA-256"
            exit 1
          fi
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"
          printf 'tarball_sha256=%s\n' "$tarball_sha256" >> "$GITHUB_OUTPUT"
          printf '%s  %s\n' "$tarball_sha256" "$tarball" > SHA256SUMS.txt
      - name: Verify the exact release candidate
        env:
          AIH_SCAN_PACKED_TARBALL: ${{ github.workspace }}/${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          npm test
      - name: Smoke-install the exact packed tarball
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          tarball="$GITHUB_WORKSPACE/${{ steps.pack.outputs.tarball }}"
          consumer="$(mktemp -d)"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund "$tarball"
          "$consumer/node_modules/.bin/aih-scan" --help
          cd "$consumer"
          # shellcheck disable=SC2016 # single quotes keep the JavaScript template literal intact
          node --input-type=module -e 'for (const entry of ["host", "read", "contracts"]) await import(`@aihq/scan/${entry}`);'
      - name: Upload immutable exact release candidate
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  npm-publish:
    needs: verify-and-pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@aihq/scan
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      TARBALL: ${{ needs.verify-and-pack.outputs.tarball }}
      EXPECTED_TARBALL_SHA256: ${{ needs.verify-and-pack.outputs.tarball_sha256 }}
      EXPECTED_ARTIFACT_ID: ${{ needs.verify-and-pack.outputs.artifact_id }}
      EXPECTED_ARTIFACT_SHA256: ${{ needs.verify-and-pack.outputs.artifact_sha256 }}
    steps:
      - name: Download immutable exact release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify-and-pack.outputs.artifact_id }}
          path: .
          digest-mismatch: error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify immutable artifact custody
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_TARBALL_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::invalid expected tarball SHA-256"
            exit 1
          fi
          case "$EXPECTED_ARTIFACT_ID" in
            ''|*[!0-9]*) echo "::error::invalid artifact id"; exit 1 ;;
          esac
          if ! [[ "$EXPECTED_ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::invalid expected artifact SHA-256"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v-scan-}"
          if [ "$GITHUB_REF_NAME" = "v0.1.0" ]; then
            tag="0.1.0"
          fi
          if [ "$TARBALL" != "aihq-scan-$tag.tgz" ]; then
            echo "::error::unexpected tarball path"
            exit 1
          fi
          test -f "$TARBALL"
          api_digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID" --jq .digest)"
          test "$api_digest" = "sha256:${EXPECTED_ARTIFACT_SHA256}"
          actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_TARBALL_SHA256"
      - name: Validate packed manifest identity
        run: |
          set -euo pipefail
          node --input-type=module - "$TARBALL" "$GITHUB_REF" <<'NODE'
          import { execFileSync } from "node:child_process";

          const [tarball, ref] = process.argv.slice(2);
          const manifest = JSON.parse(
            execFileSync("tar", ["-xOf", tarball, "package/package.json"], { encoding: "utf8" }),
          );
          const version = manifest.version;
          const expectedTag = version === "0.1.0" ? "v0.1.0" : `v-scan-${version}`;
          if (manifest.name !== "@aihq/scan" || typeof version !== "string" || ref !== `refs/tags/${expectedTag}`) {
            throw new Error(`packed manifest identity does not match ${ref}`);
          }
          const publishConfig = manifest.publishConfig;
          if (
            typeof publishConfig !== "object" ||
            publishConfig === null ||
            Array.isArray(publishConfig) ||
            Object.keys(publishConfig).length !== 1 ||
            !Object.hasOwn(publishConfig, "access") ||
            publishConfig.access !== "public"
          ) {
            throw new Error("packed manifest publishConfig must be exactly { access: public }");
          }
          NODE
      - name: Verify exact tarball before SBOM
        run: |
          set -euo pipefail
          actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_TARBALL_SHA256"
      - name: Generate tarball-scoped SPDX SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          artifact-name: aih-scan-sbom.spdx.json
          file: "${{ env.TARBALL }}"
          format: spdx-json
          output-file: aih-scan-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Verify exact tarball before attestation
        run: |
          set -euo pipefail
          actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_TARBALL_SHA256"
      - name: Attest build provenance for the exact tarball
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "${{ env.TARBALL }}"
      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Verify exact tarball before signing
        run: |
          set -euo pipefail
          actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_TARBALL_SHA256"
      - name: Sign trusted checksum and retain provenance bundle
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$EXPECTED_TARBALL_SHA256" "$(basename "$TARBALL")" > SHA256SUMS.txt
          cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt
          cp "${{ steps.attest.outputs.bundle-path }}" provenance.intoto.jsonl
      - name: Revalidate current main and tag before publication
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          mkdir release-observation
          pushd release-observation
          git init --bare
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          tag_sha="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{}")"
          if [ "$GITHUB_SHA" != "$main_sha" ] || [ "$GITHUB_SHA" != "$tag_sha" ]; then
            echo "::error::current main or tag no longer matches $GITHUB_SHA"
            exit 1
          fi
          popd
      - name: Verify exact tarball before publication
        run: |
          set -euo pipefail
          actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_TARBALL_SHA256"
      - name: Publish exact tarball through npm Trusted Publishing
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::token credentials are forbidden; npm publish must use OIDC"
            exit 1
          fi
          npm_version="$(npm --version)"
          if ! node --input-type=module - "$npm_version" <<'NODE'
          const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(
            process.argv[2] ?? "",
          );
          if (match === null) process.exit(1);
          const actual = match.slice(1, 4).map(Number);
          if (!actual.every(Number.isSafeInteger)) process.exit(1);
          const minimum = [11, 5, 1];
          for (let index = 0; index < minimum.length; index += 1) {
            if (actual[index] > minimum[index]) process.exit(0);
            if (actual[index] < minimum[index]) process.exit(1);
          }
          NODE
          then
            echo "::error::npm CLI 11.5.1 or later is required for Trusted Publishing"
            exit 1
          fi
          # Revalidate live main and tag immediately before the effect.
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          observation_root="$(mktemp -d)"
          git -C "$observation_root" init --bare
          git -C "$observation_root" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$observation_root" fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          main_sha="$(git -C "$observation_root" rev-parse refs/remotes/origin/main)"
          tag_sha="$(git -C "$observation_root" rev-parse "refs/tags/$GITHUB_REF_NAME^{}")"
          if [ "$GITHUB_SHA" != "$main_sha" ] || [ "$GITHUB_SHA" != "$tag_sha" ]; then
            echo "::error::current main or tag no longer matches $GITHUB_SHA"
            exit 1
          fi
          actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_TARBALL_SHA256"
          tarball="$TARBALL"
          # Candidate publication never changes the supported default. The same
          # accepted bytes may be promoted later under separate authorization.
          dist_tag=next
          npm publish "$tarball" --ignore-scripts --provenance --access public --registry "https://registry.npmjs.org/" --tag "$dist_tag"
      - name: Verify exact tarball before GitHub release
        run: |
          set -euo pipefail
          actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_TARBALL_SHA256"
      - name: Create immutable GitHub Release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes \
            --notes "AIH Scan content assessment. Scan results inform; they never approve or block an installation." \
            "$TARBALL" \
            SHA256SUMS.txt \
            SHA256SUMS.txt.sigstore.json \
            provenance.intoto.jsonl \
            aih-scan-sbom.spdx.json
