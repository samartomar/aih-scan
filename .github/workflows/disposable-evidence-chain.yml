name: Disposable signed evidence chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts && npm run build
      - run: node tools/disposable-chain-fixture.mjs capture "$RUNNER_TEMP/candidate.json"
      - run: cd "$RUNNER_TEMP" && sha256sum candidate.json > candidate.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-candidate
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/candidate.sha256
          retention-days: 1

  sign:
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts && npm run build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          name: unsigned-candidate
          path: ${{ runner.temp }}/candidate
      - run: sha256sum --check "$RUNNER_TEMP/candidate/candidate.sha256"
        working-directory: ${{ runner.temp }}/candidate
      - run: mkdir "$RUNNER_TEMP/sign"
      - run: node tools/disposable-chain-fixture.mjs prepare-sign "$RUNNER_TEMP/sign" "$RUNNER_TEMP/candidate/candidate.json"
      - run: node dist/cli.js sign --candidate "$RUNNER_TEMP/candidate/candidate.json" --signer "$RUNNER_TEMP/sign/signer.json" --private-key "$RUNNER_TEMP/sign/private.pem" --claims "$RUNNER_TEMP/sign/claims.json" --output "$RUNNER_TEMP/evidence.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-test-evidence
          path: |
            ${{ runner.temp }}/evidence.json
            ${{ runner.temp }}/sign/roots.json
            ${{ runner.temp }}/sign/expected.json
          retention-days: 1

  verify:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts && npm run build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          name: signed-test-evidence
          path: ${{ runner.temp }}/evidence
      - run: node dist/cli.js verify --evidence "$RUNNER_TEMP/evidence/evidence.json" --roots "$RUNNER_TEMP/evidence/roots.json" --expected "$RUNNER_TEMP/evidence/expected.json"
