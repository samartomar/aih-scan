name: CI

on:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run coverage, the installed-package test and the real analyzer proofs
        type: boolean
        default: true
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ordinary-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm
      - name: Verify every PR commit has a DCO signoff, including merges
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/verify-signoffs.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
      - run: npm ci --ignore-scripts
      - name: Select dependency-aware verification
        id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.full_validation }}
        run: |
          args=(--base "$BASE_SHA" --head "$HEAD_SHA" --plan ci-plan.json)
          if [ "$FULL_VALIDATION" = true ]; then args+=(--full); fi
          node tools/ci-route.mjs "${args[@]}"
      - name: Report selected scope
        run: cat ci-plan.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.route.outputs.analyzers == 'true'
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.route.outputs.analyzers == 'true'
        with:
          version: "0.13.10"
      - name: Provision the locked SkillSpector and Cisco runtimes outside PATH
        if: steps.route.outputs.analyzers == 'true'
        run: bash tools/analyzers/provision-test-runtimes.sh
      - run: npm run typecheck
        if: steps.route.outputs.mode != 'docs'
      - run: npm run lint
      - run: npm run verify:workflow-action-pins
      - run: npm run build
        if: steps.route.outputs.mode != 'docs'
      - name: Run selected checks (failure fails verify)
        run: node tools/ci-route.mjs --run-tests ci-plan.json
      - name: Prove the real analyzers from source and from the installed package
        if: steps.route.outputs.analyzers == 'true'
        run: npx vitest run tests/host-v1/analyzer-pins.test.ts tests/host-v1/real-analyzers.test.ts tests/host-v1/provider-batching*.test.ts tests/package-install.test.ts

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows with a checksum-verified actionlint release
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tool_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --output "${tool_dir}/${archive}"             "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${tool_dir}/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${tool_dir}/${archive}" --directory "${tool_dir}" actionlint
          "${tool_dir}/actionlint" -color
