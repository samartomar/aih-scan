name: CI

on:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run coverage, the installed-package test and the real analyzer proofs
        type: boolean
        default: true
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ordinary-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Select dependency-aware verification
        id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.full_validation }}
        run: |
          args=(--base "$BASE_SHA" --head "$HEAD_SHA" --plan ci-plan.json)
          if [ "$FULL_VALIDATION" = true ]; then args+=(--full); fi
          node tools/ci-route.mjs "${args[@]}"
      - name: Report selected scope
        run: cat ci-plan.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.route.outputs.analyzers == 'true'
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.route.outputs.analyzers == 'true'
        with:
          version: "0.12.13"
      - name: Provision the locked SkillSpector and Cisco runtimes outside PATH
        if: steps.route.outputs.analyzers == 'true'
        shell: bash
        run: |
          set -euo pipefail
          runtimes="$RUNNER_TEMP/analyzers"
          UV_PROJECT_ENVIRONMENT="$runtimes/skillspector" \
            uv sync --project tools/analyzers/skillspector --locked --no-install-project --python 3.13
          UV_PROJECT_ENVIRONMENT="$runtimes/cisco-skill-scanner" \
            uv sync --project tools/analyzers/cisco-skill-scanner --locked --no-install-project --python 3.13
          "$runtimes/skillspector/bin/skillspector" --version
          "$runtimes/cisco-skill-scanner/bin/skill-scanner" --version
          {
            echo "AIH_SCAN_TEST_SKILLSPECTOR=$runtimes/skillspector/bin/skillspector"
            echo "AIH_SCAN_TEST_SKILL_SCANNER=$runtimes/cisco-skill-scanner/bin/skill-scanner"
            echo "AIH_SCAN_REQUIRE_REAL_ANALYZERS=1"
          } >> "$GITHUB_ENV"
      - run: npm run typecheck
        if: steps.route.outputs.mode != 'docs'
      - run: npm run lint
      - run: npm run verify:workflow-action-pins
      - run: npm run build
        if: steps.route.outputs.mode != 'docs'
      - name: Run selected checks (failure fails verify)
        run: node tools/ci-route.mjs --run-tests ci-plan.json
      - name: Prove the real analyzers from source and from the installed package
        if: steps.route.outputs.analyzers == 'true'
        run: npx vitest run tests/host-v1/real-analyzers.test.ts tests/package-install.test.ts

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows with a checksum-verified actionlint release
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tool_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --output "${tool_dir}/${archive}"             "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${tool_dir}/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${tool_dir}/${archive}" --directory "${tool_dir}" actionlint
          "${tool_dir}/actionlint" -color
