name: CI

on:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run coverage, the installed-package test and the real analyzer proofs
        type: boolean
        default: true
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ordinary-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Verify every PR commit has a DCO signoff, including merges
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/verify-signoffs.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
      - run: npm ci --ignore-scripts
      - name: Select dependency-aware verification
        id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.full_validation }}
        run: |
          args=(--base "$BASE_SHA" --head "$HEAD_SHA" --plan ci-plan.json)
          if [ "$FULL_VALIDATION" = true ]; then args+=(--full); fi
          node tools/ci-route.mjs "${args[@]}"
      - name: Report selected scope
        run: cat ci-plan.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.route.outputs.analyzers == 'true'
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.route.outputs.analyzers == 'true'
        with:
          version: "0.12.13"
      - name: Provision the locked SkillSpector and Cisco runtimes outside PATH
        if: steps.route.outputs.analyzers == 'true'
        shell: bash
        run: |
          set -euo pipefail
          runtimes="$RUNNER_TEMP/analyzers"
          UV_PROJECT_ENVIRONMENT="$runtimes/skillspector" \
            uv sync --project tools/analyzers/skillspector --locked --no-install-project --python 3.13
          UV_PROJECT_ENVIRONMENT="$runtimes/cisco-skill-scanner" \
            uv sync --project tools/analyzers/cisco-skill-scanner --locked --no-install-project --python 3.13
          "$runtimes/skillspector/bin/skillspector" --version
          "$runtimes/cisco-skill-scanner/bin/skill-scanner" --version
          source="$runtimes/SkillSpector-54824463814a0be01360792523ec7245a69190fc.tar.gz"
          curl --fail --silent --show-error --location --output "$source" \
            "https://codeload.github.com/NVIDIA/SkillSpector/tar.gz/54824463814a0be01360792523ec7245a69190fc"
          echo "562349db9ef4084cfe2f18707de3d942c5b94e221162c314c795e4501fabc07d  $source" | sha256sum --check --strict
          {
            echo "AIH_SCAN_TEST_SKILLSPECTOR=$runtimes/skillspector/bin/skillspector"
            echo "AIH_SCAN_TEST_SKILL_SCANNER=$runtimes/cisco-skill-scanner/bin/skill-scanner"
            echo "AIH_SCAN_TEST_SKILLSPECTOR_SOURCE=$source"
            echo "AIH_SCAN_REQUIRE_REAL_ANALYZERS=1"
          } >> "$GITHUB_ENV"
      - run: npm run typecheck
        if: steps.route.outputs.mode != 'docs'
      - run: npm run lint
      - run: npm run verify:workflow-action-pins
      - run: npm run build
        if: steps.route.outputs.mode != 'docs'
      - name: Run selected checks (failure fails verify)
        run: node tools/ci-route.mjs --run-tests ci-plan.json
      - name: Prove the real analyzers from source and from the installed package
        if: steps.route.outputs.analyzers == 'true'
        run: npx vitest run tests/host-v1/analyzer-pins.test.ts tests/host-v1/real-analyzers.test.ts tests/package-install.test.ts

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Diagnose hosted Windows process startup and isolated seams
        run: |
          @'
          import { spawnSync } from "node:child_process";
          import { availableParallelism, totalmem } from "node:os";
          import { join } from "node:path";
          console.log(JSON.stringify({ node: process.version, parallelism: availableParallelism(), memoryGiB: totalmem() / 1024 ** 3 }));
          const powershell = join(process.env.SystemRoot, "System32/WindowsPowerShell/v1.0/powershell.exe");
          for (const [probe, command, args] of [
            ["node", process.execPath, ["-e", "process.exit(0)"]],
            ["powershell", powershell, ["-NoLogo", "-NoProfile", "-NonInteractive", "-Command", "exit 0"]],
          ]) for (let attempt = 1; attempt <= 3; attempt++) {
            const started = performance.now();
            const result = spawnSync(command, args, { windowsHide: true, timeout: 10000, stdio: "pipe" });
            console.log(JSON.stringify({ probe, attempt, durationMs: performance.now() - started, status: result.status, error: result.error?.code }));
            if (result.status !== 0) process.exitCode = 1;
          }
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vitest run tests/host-v1/analyzers.test.ts tests/release-readiness.test.ts --testNamePattern "ignores ambient TP4|accepts only a stable unambiguous npm CLI version" --no-file-parallelism
      - run: npm run verify

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows with a checksum-verified actionlint release
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tool_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --output "${tool_dir}/${archive}"             "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${tool_dir}/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${tool_dir}/${archive}" --directory "${tool_dir}" actionlint
          "${tool_dir}/actionlint" -color
