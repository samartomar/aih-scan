name: immutable baseline publication

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact source id (or use legacy catalog input)
        required: false
        type: string
      catalog:
        description: Legacy active Core catalog (ecc or superpowers); mutually exclusive with candidate
        required: false
        type: string
      request_set_url:
        description: Optional raw.githubusercontent.com exact-commit JSON request set; no Core needed
        required: false
        type: string
      request_set_sha256:
        description: Exact SHA-256 of request set bytes, required with request_set_url
        required: false
        type: string
      core_ref:
        description: Exact Core request-author commit, only for optional Core client route
        required: false
        type: string
      source_repository:
        description: Exact owner/repository selected by the candidate
        required: true
        type: string
      source_ref:
        description: Exact 40-character source commit to observe
        required: true
        type: string
      publication_generation:
        description: Immutable renewal identifier (initial or opaque eight digits); renewal runs analyzers again
        required: true
        default: initial
        type: string

permissions:
  contents: read

concurrency:
  group: baseline-publication-${{ github.repository }}-${{ github.sha }}-${{ inputs.source_repository }}-${{ inputs.source_ref }}-${{ inputs.publication_generation }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      attestations: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_sha256: ${{ steps.upload.outputs.artifact-digest }}
      pending: ${{ steps.completed.outputs.pending }}
    env:
      CANDIDATE: ${{ inputs.candidate || inputs.catalog }}
      LEGACY_CATALOG: ${{ inputs.catalog }}
      EXPLICIT_CANDIDATE: ${{ inputs.candidate }}
      REQUEST_SET_URL: ${{ inputs.request_set_url }}
      REQUEST_SET_SHA256: ${{ inputs.request_set_sha256 }}
      CORE_REF: ${{ inputs.core_ref }}
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_REF: ${{ inputs.source_ref }}
      PUBLICATION_GENERATION: ${{ inputs.publication_generation }}
    steps:
      - name: Validate immutable inputs before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PUBLICATION_GENERATION" = initial || "$PUBLICATION_GENERATION" =~ ^[0-9]{8}$ ]]
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$CANDIDATE" =~ ^[a-z0-9][a-z0-9:._-]{0,127}$ ]]
          test -z "$LEGACY_CATALOG" || test -z "$EXPLICIT_CANDIDATE"
          if [ -n "$REQUEST_SET_URL" ]; then
            test -z "$CORE_REF"
            test -z "$LEGACY_CATALOG"
            test "$CANDIDATE" != "aih"
            [[ "$REQUEST_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$REQUEST_SET_URL" =~ ^https://raw\.githubusercontent\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/[0-9a-f]{40}/[A-Za-z0-9_./-]+\.json$ ]]
            [[ "$REQUEST_SET_URL" != *"/../"* && "$REQUEST_SET_URL" != *"/./"* ]]
            exit 0
          fi
          test -z "$REQUEST_SET_SHA256"
          [[ "$CORE_REF" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$LEGACY_CATALOG" ]; then
            case "$LEGACY_CATALOG" in ecc|superpowers) ;; *) exit 1 ;; esac
          fi
          case "$CANDIDATE:$SOURCE_REPOSITORY" in
            aih:samartomar/ai-harness) test "$CORE_REF" = "$SOURCE_REF" ;;
            aih-core:samartomar/ai-harness|\
            anthropics-skills:anthropics/skills|\
            ecc:affaan-m/ECC|\
            mattpocock-skills:mattpocock/skills|\
            ponytail:DietrichGebert/ponytail|\
            superpowers:obra/Superpowers) ;;
            *) echo "::error::source repository does not match the selected candidate"; exit 1 ;;
          esac

      - name: Check out exact Scanner publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind publication to current protected Scanner main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"

      - name: Check out exact Core request author
        if: inputs.request_set_url == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: samartomar/ai-harness
          ref: ${{ inputs.core_ref }}
          path: .core
          persist-credentials: false

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          path: .source
          persist-credentials: false

      - name: Prove exact checkout identities
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$REQUEST_SET_URL" ]; then
            test "$CORE_REF" = "$(git -C .core rev-parse HEAD)"
          fi
          test "$SOURCE_REF" = "$(git -C .source rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Set up fixed Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up fixed uv runtime
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"

      - name: Install exact Scanner dependencies and optional Core client
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
          if [ -z "$REQUEST_SET_URL" ]; then
            npm --prefix .core ci --ignore-scripts
          fi

      - name: Author the canonical request independently
        working-directory: .core
        if: inputs.request_set_url == '' && inputs.catalog == '' && inputs.candidate != 'aih'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/baseline/bundles"
          node --import tsx "$GITHUB_WORKSPACE/.core/tools/prepare-candidate-baseline-requests.mjs" \
            --inventory "$GITHUB_WORKSPACE/.core/.github/baseline-candidates/$CANDIDATE.inventory.json" \
            --source "$GITHUB_WORKSPACE/.source" \
            --output "$RUNNER_TEMP/baseline/requests"

      - name: Author exact Core delivery material requests
        if: inputs.candidate == 'aih' && inputs.request_set_url == ''
        working-directory: .core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/baseline/bundles"
          node --import tsx "$GITHUB_WORKSPACE/.core/tools/prepare-aih-delivery-baseline-requests.mjs" \
            --source "$GITHUB_WORKSPACE/.core" --core-commit "$CORE_REF" \
            --output "$RUNNER_TEMP/baseline/material"
          node "$GITHUB_WORKSPACE/tools/prepare-aih-delivery-publication.mjs" \
            "$RUNNER_TEMP/baseline/material" "$CORE_REF" "$RUNNER_TEMP/baseline/requests" \
            > "$RUNNER_TEMP/baseline/aih-source-root.txt"

      - name: Author legacy active-catalog requests
        if: inputs.catalog != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/baseline/bundles"
          npm --prefix .core run baseline:request -- \
            --catalog "$LEGACY_CATALOG" --source "$GITHUB_WORKSPACE/.source" \
            --output "$RUNNER_TEMP/baseline/requests"

      - name: Prepare independently reviewed data-only requests
        if: inputs.request_set_url != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/baseline/bundles"
          curl --fail --silent --show-error --proto '=https' --max-time 60 --max-filesize 16777216 \
            "$REQUEST_SET_URL" --output "$RUNNER_TEMP/baseline/request-set.json"
          node tools/prepare-publication-request-set.mjs \
            "$RUNNER_TEMP/baseline/request-set.json" "$REQUEST_SET_SHA256" \
            "$CANDIDATE" "$SOURCE_REPOSITORY" "$SOURCE_REF" "$RUNNER_TEMP/baseline/requests"

      - name: Verify each authored request binds to the dispatched source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/baseline/requests" "$CANDIDATE" "$SOURCE_REPOSITORY" "$SOURCE_REF" <<'NODE'
          import { createHash } from "node:crypto";
          import { lstatSync, readdirSync, readFileSync } from "node:fs";
          import { join, resolve } from "node:path";

          const [requestRoot, candidate, repository, pinnedCommit] = process.argv.slice(2);
          const fail = (reason) => {
            throw new Error(`canonical baseline request batch rejected: ${reason}`);
          };
          const object = (value, label) => {
            if (value === null || typeof value !== "object" || Array.isArray(value)) fail(label);
            return value;
          };
          const exact = (value, keys, label) => {
            const actual = Object.keys(object(value, label)).sort();
            const expected = [...keys].sort();
            if (actual.length !== expected.length || actual.some((key, index) => key !== expected[index])) fail(label);
            return value;
          };
          const sha256 = (value) => typeof value === "string" && /^sha256:[0-9a-f]{64}$/.test(value);
          const rawSha256 = (value) => typeof value === "string" && /^[0-9a-f]{64}$/.test(value);
          const strictJson = (value, label) => {
            if (value === null || typeof value === "boolean") return;
            if (typeof value === "string") {
              for (let index = 0; index < value.length; index += 1) {
                const unit = value.charCodeAt(index);
                if (unit >= 0xd800 && unit <= 0xdbff) {
                  const next = value.charCodeAt(index + 1);
                  if (!(next >= 0xdc00 && next <= 0xdfff)) fail(`${label} Unicode`);
                  index += 1;
                } else if (unit >= 0xdc00 && unit <= 0xdfff || value.normalize("NFC") !== value)
                  fail(`${label} text`);
              }
              return;
            }
            if (typeof value === "number") {
              if (!Number.isFinite(value) || Object.is(value, -0)) fail(`${label} number`);
              return;
            }
            if (Array.isArray(value)) {
              for (const item of value) strictJson(item, label);
              return;
            }
            if (value !== null && typeof value === "object") {
              for (const [key, item] of Object.entries(value)) {
                strictJson(key, `${label} key`);
                strictJson(item, `${label}.${key}`);
              }
              return;
            }
            fail(`${label} value`);
          };
          const canonical = (value) => {
            if (value === null || typeof value === "boolean" || typeof value === "string" || typeof value === "number")
              return JSON.stringify(value);
            if (Array.isArray(value)) return `[${value.map(canonical).join(",")}]`;
            return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${canonical(value[key])}`).join(",")}}`;
          };
          const coverageDigest = (coverage) => {
            const { coverageDigest: ignoredDigest, requestSha256: ignoredRequestSha256, ...unsigned } = coverage;
            void ignoredDigest;
            void ignoredRequestSha256;
            strictJson(unsigned, "coverage map");
            return `sha256:${createHash("sha256").update(canonical(unsigned), "utf8").digest("hex")}`;
          };
          const sameStrings = (left, right) =>
            Array.isArray(left) && Array.isArray(right) && left.length === right.length && left.every((value, index) => value === right[index]);
          const coverageSource = {
            "mattpocock-skills": {
              id: "source:mattpocock",
              inputFormat: "pinned-skill-collection/v1",
              repository: "https://github.com/mattpocock/skills",
            },
            ponytail: {
              id: "source:ponytail",
              inputFormat: "pinned-component-collection/v1",
              repository: "https://github.com/DietrichGebert/ponytail",
            },
          }[candidate];
          if (
            typeof requestRoot !== "string" ||
            typeof candidate !== "string" ||
            typeof repository !== "string" ||
            typeof pinnedCommit !== "string"
          )
            fail("arguments");
          const root = resolve(requestRoot);
          const rootStat = lstatSync(root);
          if (!rootStat.isDirectory() || rootStat.isSymbolicLink()) fail("request directory");
          const entries = readdirSync(root, { withFileTypes: true }).sort((left, right) =>
            left.name.localeCompare(right.name),
          );
          const coverageEntries = entries.filter((entry) => entry.name === "coverage-map.json");
          const requestEntries = entries.filter((entry) => entry.name !== "coverage-map.json");
          if (
            requestEntries.length === 0 ||
            coverageEntries.length > 1 ||
            entries.length !== requestEntries.length + coverageEntries.length ||
            coverageEntries.some((entry) => !entry.isFile() || entry.isSymbolicLink()) ||
            (coverageEntries.length === 1 && coverageSource === undefined)
          )
            fail("request directory layout");
          const requests = requestEntries.map((entry, index) => {
            const expectedName = `batch-${String(index + 1).padStart(3, "0")}.request.json`;
            if (entry.name !== expectedName || !entry.isFile() || entry.isSymbolicLink())
              fail("request directory layout");
            const requestPath = resolve(join(root, entry.name));
            const requestStat = lstatSync(requestPath);
            if (!requestStat.isFile() || requestStat.isSymbolicLink()) fail("request file");
            let request;
            try {
              request = JSON.parse(readFileSync(requestPath, "utf8"));
            } catch {
              fail("request JSON");
            }
            const source = request !== null && typeof request === "object" ? request.source : undefined;
            if (source === null || typeof source !== "object" || Array.isArray(source))
              fail("request source");
            if (
              source.id !== candidate ||
              typeof source.owner !== "string" ||
              typeof source.repository !== "string" ||
              `${source.owner}/${source.repository}` !== repository ||
              source.pinnedCommit !== pinnedCommit
            )
              fail("request source identity");
            return request;
          });
          if (coverageEntries.length === 0) process.exit(0);
          let coverage;
          try {
            coverage = JSON.parse(readFileSync(resolve(join(root, "coverage-map.json")), "utf8"));
          } catch {
            fail("coverage map JSON");
          }
          exact(
            coverage,
            [
              "authority",
              "compilerInputDigest",
              "components",
              "coverageDigest",
              "pinnedCommit",
              "repository",
              "requestSha256",
              "scope",
              "source",
              "sourceTreeSha256",
              "unmappedDerivedAssets",
              "version",
            ],
            "coverage map",
          );
          if (
            coverage.version !== "workbench-scanner-coverage/v1" ||
            coverage.authority !== "none" ||
            coverage.scope !== "declared-source-files" ||
            coverage.repository !== repository ||
            coverage.pinnedCommit !== pinnedCommit ||
            !sha256(coverage.compilerInputDigest) ||
            !sha256(coverage.coverageDigest) ||
            coverage.coverageDigest !== coverageDigest(coverage) ||
            !rawSha256(coverage.sourceTreeSha256) ||
            !sameStrings(coverage.requestSha256, requests.map((request) => request.requestSha256))
          )
            fail("coverage map identity");
          exact(coverage.source, ["contentDigest", "id", "inputFormat", "repository", "revisionId"], "coverage source");
          if (
            coverage.source.id !== coverageSource.id ||
            coverage.source.revisionId !== pinnedCommit ||
            coverage.source.repository !== coverageSource.repository ||
            coverage.source.inputFormat !== coverageSource.inputFormat ||
            !sha256(coverage.source.contentDigest)
          )
            fail("coverage source identity");
          const requestComponents = new Map();
          for (const request of requests) {
            if (!rawSha256(request.requestSha256) || !rawSha256(request.source?.treeSha256) || request.source.treeSha256 !== coverage.sourceTreeSha256 || !Array.isArray(request.components))
              fail("coverage request binding");
            for (const component of request.components) {
              if (
                component === null ||
                typeof component !== "object" ||
                Array.isArray(component) ||
                typeof component.id !== "string" ||
                !Array.isArray(component.paths) ||
                !component.paths.every((path) => typeof path === "string") ||
                !rawSha256(component.treeSha256) ||
                requestComponents.has(component.id)
              )
                fail("coverage request component");
              requestComponents.set(component.id, component);
            }
          }
          if (!Array.isArray(coverage.components) || coverage.components.length !== requestComponents.size || !Array.isArray(coverage.unmappedDerivedAssets) || !coverage.unmappedDerivedAssets.every((id) => typeof id === "string"))
            fail("coverage components");
          const mapped = new Set();
          for (const component of coverage.components) {
            exact(component, ["componentId", "componentTreeSha256", "paths", "subject"], "coverage component");
            const request = requestComponents.get(component.componentId);
            if (
              request === undefined ||
              mapped.has(component.componentId) ||
              component.componentTreeSha256 !== request.treeSha256 ||
              !sameStrings(component.paths, request.paths)
            )
              fail("coverage component binding");
            exact(component.subject, ["assetId", "contentDigest", "sourceId", "sourceRevisionId"], "coverage subject");
            if (
              typeof component.subject.assetId !== "string" ||
              component.subject.sourceId !== coverage.source.id ||
              component.subject.sourceRevisionId !== pinnedCommit ||
              !sha256(component.subject.contentDigest)
            )
              fail("coverage subject binding");
            mapped.add(component.componentId);
          }
          if (mapped.size !== requestComponents.size) fail("coverage component completeness");
          NODE
      - name: Reuse only exact completed publications before analyzers
        id: completed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify-baseline-publication-reuse.mjs \
            --requests "$RUNNER_TEMP/baseline/requests" \
            --pending "$RUNNER_TEMP/baseline/pending" \
            --reuse-directory "$RUNNER_TEMP/baseline/reused" \
            --repository "$GITHUB_REPOSITORY" \
            --publisher-sha "$GITHUB_SHA" \
            --generation "$PUBLICATION_GENERATION" \
            --source-ref "$GITHUB_REF" \
            --workflow "$GITHUB_REPOSITORY/.github/workflows/baseline-publication.yml" \
            --scanner "$GITHUB_WORKSPACE/dist/cli.js" \
            --github-output "$GITHUB_OUTPUT"
      - name: Bind Scanner analyzer isolation
        if: steps.completed.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor apparmor-profiles bubblewrap
          apparmor_profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -r "$apparmor_profile"
          sudo apparmor_parser --replace "$apparmor_profile"
          python_prefix="$(python3.13 -c 'import sys; print(sys.prefix)')"
          case "$python_prefix" in
            /usr|/usr/*) echo "::error::unexpected setup-python prefix"; exit 1 ;;
          esac
          sudo cp -a "${python_prefix}/." /usr/local/
          sudo install -m 0644 \
            "${python_prefix}/lib/libpython3.13.so.1.0" \
            /usr/lib/x86_64-linux-gnu/libpython3.13.so.1.0
          sudo install -m 0755 "$(command -v uv)" /usr/local/bin/uv
          sudo ln -sf /usr/local/bin/python3.13 /usr/bin/python3.13
          test "$(id -u)" -ne 0
          test -x /usr/bin/docker
          test -x /usr/bin/bwrap
          test -x /usr/local/bin/uv
          /usr/bin/python3.13 -c 'import sys; assert sys.version_info[:2] == (3, 13)'


      - name: Execute Scanner analyzers once per canonical request
        if: steps.completed.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          requests=("$RUNNER_TEMP/baseline/pending"/*.request.json)
          test "${#requests[@]}" -gt 0
          scanner_source="$GITHUB_WORKSPACE/.source"
          if [ "$CANDIDATE" = "aih" ]; then
            scanner_source="$(cat "$RUNNER_TEMP/baseline/aih-source-root.txt")"
            test -d "$scanner_source" && test ! -L "$scanner_source"
            test "$(dirname "$scanner_source")" = "$RUNNER_TEMP/baseline/material"
          fi
          for request in "${requests[@]}"; do
            batch="$(basename "$request" .request.json)"
            node dist/cli.js baseline-vet \
              --request "$request" \
              --source "$scanner_source" \
              --output "$RUNNER_TEMP/baseline/bundles/$batch.bundle"
          done

      - name: Sign, pack, and independently inspect portable publications
        if: steps.completed.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          signing_root="$(mktemp -d)"
          trap 'rm -rf -- "$signing_root"' EXIT
          openssl genpkey -algorithm ED25519 -out "$signing_root/private.pem"
          chmod 0600 "$signing_root/private.pem"
          openssl pkey -in "$signing_root/private.pem" -pubout -outform DER \
            -out "$signing_root/public.der"
          key_id="ed25519:$(sha256sum "$signing_root/public.der" | cut -d ' ' -f 1)"
          public_key="$(base64 -w 0 "$signing_root/public.der")"
          signed_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          expires_at="$(date -u -d '+45 minutes' +'%Y-%m-%dT%H:%M:%S.000Z')"
          jq -n --arg key "$key_id" \
            '{identity:"github-actions:aih-scan-baseline-publication",class:"test-ephemeral",keyId:$key}' \
            > "$signing_root/signer.json"
          jq -n --arg signed "$signed_at" --arg expires "$expires_at" \
            '{signedAt:$signed,expiresAt:$expires}' > "$signing_root/claims.json"
          jq -n --arg key "$key_id" --arg public "$public_key" \
            '{roots:[{identity:"github-actions:aih-scan-baseline-publication",class:"test-ephemeral",keyId:$key,publicKeySpkiBase64:$public}]}' \
            > "$signing_root/roots.json"
          jq -n --arg now "$signed_at" --arg key "$key_id" \
            '{now:$now,signer:{identity:"github-actions:aih-scan-baseline-publication",class:"test-ephemeral",keyId:$key}}' \
            > "$signing_root/expected.json"
          mkdir "$RUNNER_TEMP/baseline/publications"
          if [[ -f "$RUNNER_TEMP/baseline/requests/coverage-map.json" ]]; then
            cp "$RUNNER_TEMP/baseline/requests/coverage-map.json" "$RUNNER_TEMP/baseline/publications/coverage-map.json"
          fi
          for request in "$RUNNER_TEMP/baseline/pending"/*.request.json; do
            batch="$(basename "$request" .request.json)"
            bundle="$RUNNER_TEMP/baseline/bundles/$batch.bundle"
            evidence="$signing_root/$batch.evidence.json"
            node dist/cli.js baseline-sign \
              --request "$request" --bundle "$bundle" \
              --signer "$signing_root/signer.json" --private-key "$signing_root/private.pem" \
              --claims "$signing_root/claims.json" --output "$evidence"
            request_sha256="$(jq -er '.requestSha256 | select(test("^[0-9a-f]{64}$"))' "$request")"
            output="$RUNNER_TEMP/baseline/publications/$request_sha256"
            mkdir "$output"
            tag="baseline-v1-$GITHUB_SHA-$request_sha256"
            if [[ "$PUBLICATION_GENERATION" != initial ]]; then tag="$tag-r$PUBLICATION_GENERATION"; fi
            locator="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/publication.json"
            node dist/cli.js baseline-pack \
              --evidence "$evidence" --request "$request" --bundle "$bundle" \
              --roots "$signing_root/roots.json" --expected "$signing_root/expected.json" \
              --locator "$locator" --publication "$output/publication.json" \
              --discovery "$output/discovery.json"
            node dist/cli.js baseline-inspect \
              --discovery "$output/discovery.json" --publication "$output/publication.json" \
              --request-sha256 "$request_sha256" > "$output/inspection.json"
            (cd "$output" && sha256sum publication.json discovery.json inspection.json > SHA256SUMS)
          done

      - name: Transfer immutable publication candidates
        id: upload
        if: steps.completed.outputs.pending == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-publications-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baseline/publications
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    if: needs.build.outputs.pending == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: baseline-evidence-publish
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - name: Download exact same-run publication candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: publications
          digest-mismatch: error

      - name: Verify artifact custody and closed publication layout
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          EXPECTED_ARTIFACT_SHA256: ${{ needs.build.outputs.artifact_sha256 }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          api_digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID" --jq .digest)"
          test "$api_digest" = "sha256:$EXPECTED_ARTIFACT_SHA256"
          shopt -s nullglob
          for entry in publications/*; do
            if [[ "$(basename "$entry")" = "coverage-map.json" ]]; then
              test -f "$entry"
              test ! -L "$entry"
            else
              test -d "$entry"
            fi
          done
          directories=(publications/*/)
          test "${#directories[@]}" -gt 0
          for directory in "${directories[@]}"; do
            test -d "$directory"
            request_sha256="$(basename "$directory")"
            [[ "$request_sha256" =~ ^[0-9a-f]{64}$ ]]
            test "$(find "$directory" -maxdepth 1 -type f | wc -l)" -eq 4
            (cd "$directory" && sha256sum -c SHA256SUMS)
            test "$(jq -er '.requestSha256' "$directory/discovery.json")" = "$request_sha256"
            test "$(jq -er '.authority' "$directory/discovery.json")" = "none"
          done

      - name: Attest exact publication bytes
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: publications/*/publication.json

      - name: Create no-overwrite publisher-and-request-addressed releases
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_GENERATION: ${{ inputs.publication_generation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PUBLICATION_GENERATION" = initial || "$PUBLICATION_GENERATION" =~ ^[0-9]{8}$ ]]
          for directory in publications/*/; do
            request_sha256="$(basename "$directory")"
            [[ "$request_sha256" =~ ^[0-9a-f]{64}$ ]]
            tag="baseline-v1-$GITHUB_SHA-$request_sha256"
            if [[ "$PUBLICATION_GENERATION" != initial ]]; then tag="$tag-r$PUBLICATION_GENERATION"; fi
            expected_locator="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/publication.json"
            test "$(jq -er '.locator' "$directory/discovery.json")" = "$expected_locator"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::publication release already exists: $tag"
              exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::publication tag already exists: $tag"
              exit 1
            fi
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "Content-addressed Scanner evidence. Authority: none. Publisher: $GITHUB_SHA. Request: $request_sha256." \
              "$directory/publication.json" \
              "$directory/discovery.json" \
              "$directory/inspection.json" \
              "$directory/SHA256SUMS"
          done
