# Manual: sign the reviewed summaries of one candidate run with `aih-scan sign`. The signer job
# runs in this workflow file on main, so its keyless certificate carries the default trusted
# publisher identity (`defaultSigners` in @aihq/scan/contracts). Each bundle is a Sigstore
# messageSignature bundle (aih-sigstore-keyless/1) and is verified against the default signers
# before upload. The signer installs and builds nothing: it runs the exact CLI that the read-only
# job packed and installed with runtime dependencies only from the committed lockfile, before any
# candidate byte was downloaded or read, after checking that runtime's digest.
# Nothing is published to a store or a release here. See docs/production-publisher.md.
name: Restricted Scan report publisher
on:
  workflow_dispatch:
    inputs:
      producer_json:
        description: Optional reviewed producer context JSON (SHA-256 must equal vars.SCAN_REPORT_PRODUCER_SHA256)
        required: false
        default: ""
        type: string
      candidate_run_id:
        description: Independently reviewed candidate run ID
        required: true
        type: string
      selection_sha256:
        description: Reviewed SHA-256 of the summary selection listing
        required: true
        type: string
permissions: {}
concurrency:
  group: scan-report-publisher
  cancel-in-progress: false
jobs:
  bounded-candidate:
    if: github.event.repository.visibility == 'public' && github.event_name == 'workflow_dispatch' && github.repository == 'samartomar/aih-scan' && github.repository_id == '1336836161' && github.repository_owner_id == '9993940' && github.ref == 'refs/heads/main' && github.workflow_ref == 'samartomar/aih-scan/.github/workflows/scan-report-publisher.yml@refs/heads/main' && github.sha == vars.SCAN_REPORT_REVIEWED_HEAD && github.actor == 'samartomar' && github.actor_id == '9993940' && github.triggering_actor == 'samartomar' && github.run_attempt == '1' && vars.SCAN_REPORT_CANDIDATE_ARTIFACT_ID != '' && vars.SCAN_REPORT_CANDIDATE_ARTIFACT_DIGEST != '' && vars.SCAN_REPORT_CANDIDATE_RUN_ID != '' && vars.SCAN_REPORT_SELECTION_SHA256 != '' && inputs.candidate_run_id == vars.SCAN_REPORT_CANDIDATE_RUN_ID && inputs.selection_sha256 == vars.SCAN_REPORT_SELECTION_SHA256 && ((inputs.producer_json == '' && vars.SCAN_REPORT_PRODUCER_SHA256 == '') || (inputs.producer_json != '' && vars.SCAN_REPORT_PRODUCER_SHA256 != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      runtime_sha256: ${{ steps.runtime.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts && npm run build
      - name: Pack the exact CLI and install it with runtime dependencies only for the signer
        id: runtime
        run: |-
          set -euo pipefail
          mkdir "$RUNNER_TEMP/packed" signer-runtime
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/packed" > "$RUNNER_TEMP/pack.json"
          tarball="$RUNNER_TEMP/packed/$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0].filename' "$RUNNER_TEMP/pack.json")"
          cp package.json package-lock.json signer-runtime/
          cd signer-runtime
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p node_modules/@aihq/scan
          tar --extract --file "$tarball" --strip-components=1 --directory node_modules/@aihq/scan --no-same-owner --no-same-permissions
          cd ..
          tar --create --file signer-runtime.tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 signer-runtime
          echo "sha256=$(sha256sum signer-runtime.tar | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signer-runtime
          path: signer-runtime.tar
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Validate the independent reviewed producer context
        if: inputs.producer_json != ''
        id: producer
        env:
          PRODUCER_JSON: ${{ inputs.producer_json }}
          PRODUCER_SHA256: ${{ vars.SCAN_REPORT_PRODUCER_SHA256 }}
        run: |-
          set -euo pipefail
          printf '%s' "$PRODUCER_JSON" > "$RUNNER_TEMP/producer.json"
          echo "source_commit=$(node tools/publisher/candidate.mjs producer-source "$RUNNER_TEMP/producer.json" "$PRODUCER_SHA256")" >> "$GITHUB_OUTPUT"
      - name: Check out only the independently reviewed producer source
        if: inputs.producer_json != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.producer.outputs.source_commit }}
          path: reviewed-producer
          persist-credentials: false
      - name: Build the isolated producer with its exact reviewed lock and package
        if: inputs.producer_json != ''
        env:
          PRODUCER_SHA256: ${{ vars.SCAN_REPORT_PRODUCER_SHA256 }}
        run: |-
          set -euo pipefail
          node tools/publisher/candidate.mjs producer-build "$RUNNER_TEMP/producer.json" "$PRODUCER_SHA256" reviewed-producer "$RUNNER_TEMP/producer-consumer"
      - name: Verify immutable candidate run custody before download
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ vars.SCAN_REPORT_CANDIDATE_RUN_ID }}
          HEAD: ${{ vars.SCAN_REPORT_REVIEWED_HEAD }}
          ARCHIVE_ID: ${{ vars.SCAN_REPORT_CANDIDATE_ARTIFACT_ID }}
          ARCHIVE_DIGEST: ${{ vars.SCAN_REPORT_CANDIDATE_ARTIFACT_DIGEST }}
        run: |-
          set -euo pipefail
          case "$RUN_ID" in ''|*[!0-9]*) exit 1;; esac
          test "${#RUN_ID}" -le 16
          gh api "repos/samartomar/aih-scan/actions/runs/$RUN_ID" > run.json
          gh api "repos/samartomar/aih-scan/actions/runs/$RUN_ID/artifacts?per_page=100" > archives.json
          node tools/publisher/candidate.mjs check-run run.json archives.json "$RUN_ID" "$HEAD" "$ARCHIVE_ID" "$ARCHIVE_DIGEST"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ vars.SCAN_REPORT_CANDIDATE_ARTIFACT_ID }}
          digest-mismatch: error
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Select the reviewed summaries and read each one
        env:
          SELECTION_SHA: ${{ vars.SCAN_REPORT_SELECTION_SHA256 }}
          PRODUCER_SHA256: ${{ vars.SCAN_REPORT_PRODUCER_SHA256 }}
        run: |-
          set -euo pipefail
          if [ -f candidate/prepared-import.json ]; then
            consumer=signer-runtime
            producer_args=()
            if [ -n "$PRODUCER_SHA256" ]; then
              consumer="$RUNNER_TEMP/producer-consumer"
              producer_args=("$RUNNER_TEMP/producer.json" "$PRODUCER_SHA256")
            fi
            node tools/publisher/candidate.mjs prepared-check candidate "$consumer" "${producer_args[@]}"
          elif [ -n "$PRODUCER_SHA256" ]; then
            exit 1
          fi
          node tools/publisher/candidate.mjs select candidate "$SELECTION_SHA" selected > selection.txt
          while read -r _digest path; do
            node dist/cli.js read "selected/$path" > /dev/null
          done < selection.txt
          cp selection.txt selected/selection.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checked-summaries
          path: selected/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  signer:
    needs: bounded-candidate
    if: github.event.repository.visibility == 'public' && github.event_name == 'workflow_dispatch' && github.repository == 'samartomar/aih-scan' && github.repository_id == '1336836161' && github.repository_owner_id == '9993940' && github.ref == 'refs/heads/main' && github.workflow_ref == 'samartomar/aih-scan/.github/workflows/scan-report-publisher.yml@refs/heads/main' && github.sha == vars.SCAN_REPORT_REVIEWED_HEAD && github.actor == 'samartomar' && github.actor_id == '9993940' && github.triggering_actor == 'samartomar' && github.run_attempt == '1' && vars.SCAN_REPORT_CANDIDATE_ARTIFACT_ID != '' && vars.SCAN_REPORT_CANDIDATE_ARTIFACT_DIGEST != '' && vars.SCAN_REPORT_CANDIDATE_RUN_ID != '' && vars.SCAN_REPORT_SELECTION_SHA256 != '' && inputs.candidate_run_id == vars.SCAN_REPORT_CANDIDATE_RUN_ID && inputs.selection_sha256 == vars.SCAN_REPORT_SELECTION_SHA256 && ((inputs.producer_json == '' && vars.SCAN_REPORT_PRODUCER_SHA256 == '') || (inputs.producer_json != '' && vars.SCAN_REPORT_PRODUCER_SHA256 != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: scan-report-signing-prod
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signer-runtime
          digest-mismatch: error
          path: runtime
      - name: Check the packed runtime's digest and unpack it
        env:
          RUNTIME_SHA: ${{ needs.bounded-candidate.outputs.runtime_sha256 }}
        run: |-
          set -euo pipefail
          case "$RUNTIME_SHA" in ''|*[!0-9a-f]*) exit 1;; esac
          test "${#RUNTIME_SHA}" -eq 64
          test "$(sha256sum runtime/signer-runtime.tar | awk '{print $1}')" = "$RUNTIME_SHA"
          tar --extract --file runtime/signer-runtime.tar --no-same-owner --no-same-permissions
          test -f signer-runtime/node_modules/@aihq/scan/dist/cli.js
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: checked-summaries
          digest-mismatch: error
          path: signing
      - name: Recheck the selection, sign each summary and verify it under the default signers
        env:
          SELECTION_SHA: ${{ vars.SCAN_REPORT_SELECTION_SHA256 }}
        run: |-
          set -euo pipefail
          test "$(sha256sum signing/selection.txt | awk '{print $1}')" = "$SELECTION_SHA"
          cli=signer-runtime/node_modules/@aihq/scan/dist/cli.js
          while read -r digest path; do
            test "$(sha256sum "signing/$path" | awk '{print $1}')" = "$digest"
            node "$cli" sign "signing/$path"
            bundle="signing/${path%.json}.sigstore"
            node "$cli" verify "signing/$path" --bundle "$bundle" --json > "signing/${path%.json}.verified.json"
            node -e 'const r=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); if(r.status!=="ok"||r.verified!==true||r.signer?.trusted!==true||r.withdrawn!==false) process.exit(1)' "signing/${path%.json}.verified.json"
          done < signing/selection.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scan-report-signed
          path: signing/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
