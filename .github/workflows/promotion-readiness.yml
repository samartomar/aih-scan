name: promotion-readiness

# Read-only promotion gate. It proves that the exact bytes sitting on npm `next` are the
# bytes Core's compatibility run tested, and then PRINTS the dist-tag commands. It never
# runs them: moving a dist tag stays a manual, 2FA npm session by the owner.
#
# The required check to protect with is: promotion-readiness / authorize
on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: The exact @aihq/scan version on npm next, for example 0.5.0
        required: true
        type: string
      compatibility_run_id:
        description: Core sibling-compatibility run id that tested this candidate
        required: true
        type: string
      compatibility_run_attempt:
        description: Core sibling-compatibility run attempt
        required: true
        type: string
      promotion_authorization_comment:
        description: The owner's full-SHA promotion authorization statement
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: promotion-readiness-${{ inputs.candidate_version }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse malformed inputs
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          COMPATIBILITY_RUN_ID: ${{ inputs.compatibility_run_id }}
          COMPATIBILITY_RUN_ATTEMPT: ${{ inputs.compatibility_run_attempt }}
          PROMOTION_AUTHORIZATION_COMMENT: ${{ inputs.promotion_authorization_comment }}
        run: |
          set -euo pipefail
          printf '%s' "$CANDIDATE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "refused: candidate_version must be an exact X.Y.Z version" >&2; exit 1; }
          printf '%s' "$COMPATIBILITY_RUN_ID" | grep -Eq '^[1-9][0-9]{0,19}$' \
            || { echo "refused: compatibility_run_id must be a run id" >&2; exit 1; }
          printf '%s' "$COMPATIBILITY_RUN_ATTEMPT" | grep -Eq '^[1-9][0-9]{0,3}$' \
            || { echo "refused: compatibility_run_attempt must be a run attempt" >&2; exit 1; }
          printf '%s' "$PROMOTION_AUTHORIZATION_COMMENT" \
            | grep -Fq "Authorize promoting @aihq/scan@$CANDIDATE_VERSION from next to latest" \
            || { echo "refused: promotion_authorization_comment does not name this candidate" >&2; exit 1; }

      - name: Refuse evidence from any run but Core's own main compatibility run
        env:
          GH_TOKEN: ${{ github.token }}
          COMPATIBILITY_RUN_ID: ${{ inputs.compatibility_run_id }}
          COMPATIBILITY_RUN_ATTEMPT: ${{ inputs.compatibility_run_attempt }}
        run: |
          set -euo pipefail
          # Any ai-harness run can upload an artifact with the expected name, including a
          # pull request from a fork, so the run itself is checked before its artifact is read.
          # `gh run view --json` exposes no workflow file path; the REST run object does.
          gh api "repos/samartomar/ai-harness/actions/runs/$COMPATIBILITY_RUN_ID" > compatibility-run.json \
            || { echo "refused: Core compatibility run $COMPATIBILITY_RUN_ID is unreadable" >&2; exit 1; }
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const refuse = (reason) => {
            process.stderr.write(`refused: ${reason}\n`);
            process.exit(1);
          };
          let run;
          try {
            run = JSON.parse(readFileSync("compatibility-run.json", "utf8"));
          } catch {
            refuse("the compatibility run description is not readable JSON");
          }
          if (run === null || typeof run !== "object" || Array.isArray(run))
            refuse("the compatibility run description is not an object");
          if (String(run.id) !== process.env.COMPATIBILITY_RUN_ID)
            refuse(`the compatibility run is ${run.id}, not ${process.env.COMPATIBILITY_RUN_ID}`);
          if (run.head_repository?.full_name !== "samartomar/ai-harness")
            refuse(`the compatibility run ran from ${run.head_repository?.full_name}, not samartomar/ai-harness`);
          if (run.path !== ".github/workflows/sibling-compatibility.yml")
            refuse(`the compatibility run is ${run.path}, not .github/workflows/sibling-compatibility.yml`);
          if (run.event !== "schedule" && run.event !== "workflow_dispatch")
            refuse(`the compatibility run was triggered by ${run.event}, not schedule or workflow_dispatch`);
          if (run.head_branch !== "main")
            refuse(`the compatibility run ran on ${run.head_branch}, not main`);
          if (run.conclusion !== "success")
            refuse(`the compatibility run concluded ${run.conclusion}, not success`);
          if (String(run.run_attempt) !== process.env.COMPATIBILITY_RUN_ATTEMPT)
            refuse(
              `the compatibility run's latest attempt is ${run.run_attempt}, not ${process.env.COMPATIBILITY_RUN_ATTEMPT}`,
            );
          NODE

      - name: Download Core's sibling-compatibility evidence
        env:
          GH_TOKEN: ${{ github.token }}
          COMPATIBILITY_RUN_ID: ${{ inputs.compatibility_run_id }}
        run: |
          set -euo pipefail
          mkdir -p compatibility
          gh run download "$COMPATIBILITY_RUN_ID" \
            --repo samartomar/ai-harness \
            --name core-sibling-compatibility \
            --dir compatibility \
            || { echo "refused: Core compatibility artifact is unreadable for run $COMPATIBILITY_RUN_ID" >&2; exit 1; }
          test -f compatibility/core-sibling-compatibility.json \
            || { echo "refused: artifact does not contain core-sibling-compatibility.json" >&2; exit 1; }

      - name: Re-observe the live registry state
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          set -euo pipefail
          npm view "@aihq/scan@$CANDIDATE_VERSION" dist.integrity --json > live-integrity.json
          npm view "@aihq/scan" dist-tags --json > live-dist-tags.json
          # Downloading the exact published tarball is read-only; nothing is installed and
          # no package script runs, so the bytes are observed without executing them.
          # npm pack does not create its destination directory.
          mkdir -p candidate
          npm pack "@aihq/scan@$CANDIDATE_VERSION" --ignore-scripts --pack-destination candidate
          sha256sum "candidate/aihq-scan-$CANDIDATE_VERSION.tgz" | cut -d' ' -f1 > live-tarball-sha256.txt
          cat live-dist-tags.json

      - name: Refuse unless the tested bytes are the bytes being promoted
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          COMPATIBILITY_RUN_ID: ${{ inputs.compatibility_run_id }}
          COMPATIBILITY_RUN_ATTEMPT: ${{ inputs.compatibility_run_attempt }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const refuse = (reason) => {
            process.stderr.write(`refused: ${reason}\n`);
            process.exit(1);
          };
          const readJson = (path) => {
            try {
              return JSON.parse(readFileSync(path, "utf8"));
            } catch {
              return refuse(`${path} is not readable JSON`);
            }
          };

          const candidateVersion = process.env.CANDIDATE_VERSION;
          const evidence = readJson("compatibility/core-sibling-compatibility.json");
          if (
            evidence === null ||
            typeof evidence !== "object" ||
            Array.isArray(evidence) ||
            evidence.format !== "core-sibling-compatibility" ||
            evidence.version !== 1 ||
            !Array.isArray(evidence.legs)
          )
            refuse("the compatibility artifact declares an unknown format or version");
          if (
            String(evidence.runId) !== process.env.COMPATIBILITY_RUN_ID ||
            String(evidence.runAttempt) !== process.env.COMPATIBILITY_RUN_ATTEMPT
          )
            refuse("the compatibility artifact was produced by a different run or attempt");

          const legs = evidence.legs.filter(
            (leg) => leg !== null && typeof leg === "object" && leg.package === "@aihq/scan",
          );
          if (legs.length !== 1) refuse("the compatibility artifact names no single @aihq/scan leg");
          const leg = legs[0];
          if (leg.version !== candidateVersion)
            refuse(`the tested leg is ${leg.version}, not ${candidateVersion}`);
          if (!Array.isArray(leg.contractChecks) || leg.contractChecks.length === 0)
            refuse("the tested leg records no contract checks");
          const failed = leg.contractChecks.filter((check) => check?.status !== "passed");
          if (failed.length !== 0)
            refuse(`${failed.length} contract check(s) in the tested leg did not pass`);

          const liveIntegrity = readJson("live-integrity.json");
          if (typeof liveIntegrity !== "string" || liveIntegrity.length === 0)
            refuse("the registry reports no dist.integrity for this candidate");
          if (leg.tarballIntegrity !== liveIntegrity)
            refuse("the registry integrity differs from the integrity the compatibility run tested");

          const liveSha256 = readFileSync("live-tarball-sha256.txt", "utf8").trim();
          if (!/^[0-9a-f]{64}$/u.test(liveSha256))
            refuse("the downloaded candidate tarball produced no sha256");
          if (leg.tarballSha256 !== liveSha256)
            refuse("the published tarball bytes differ from the bytes the compatibility run tested");

          const distTags = readJson("live-dist-tags.json");
          if (distTags?.next !== candidateVersion)
            refuse(`npm dist-tags.next is ${distTags?.next}, not ${candidateVersion}`);

          process.stdout.write(
            `${JSON.stringify({
              status: "READY",
              candidateVersion,
              testedBy: { runId: evidence.runId, runAttempt: evidence.runAttempt },
              tarballSha256: liveSha256,
              tarballIntegrity: liveIntegrity,
              contractChecks: leg.contractChecks.length,
              authority: "none",
              limitation:
                "This gate proves the bytes on next are the bytes Core tested. It is not owner authorization and it moves no dist tag.",
            })}\n`,
          );
          NODE

      - name: Print the promotion commands without running them
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          set -euo pipefail
          # Printed only. This job has no npm credentials and executes no dist-tag change.
          cat <<EOF
          Promotion readiness passed for @aihq/scan@$CANDIDATE_VERSION.

          Run these yourself in an authenticated 2FA npm session:

            npm dist-tag add @aihq/scan@$CANDIDATE_VERSION latest
            npm dist-tag rm @aihq/scan next
            gh release edit v-scan-$CANDIDATE_VERSION --repo samartomar/aih-scan --prerelease=false --latest
            npm view @aihq/scan dist-tags --json

          This job changed nothing. A green run is evidence that the tested bytes and the
          published bytes are the same; it is not the owner's promotion authorization.
          EOF
