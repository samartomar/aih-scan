# Manual: scan reviewed, pinned public sources with the packed installed CLI and upload the
# unsigned candidate. It reads only the pinned sources (public Git clone or npm tarball before
# scanning) and runs the analyzers in static mode; nothing is signed or published here. See
# docs/production-publisher.md.
name: Scan report candidate
on:
  workflow_dispatch:
    inputs:
      producer_json:
        description: Optional reviewed producer context JSON (SHA-256 must equal vars.SCAN_REPORT_PRODUCER_SHA256)
        required: false
        default: ""
        type: string
      sources_json:
        description: Exact reviewed sources JSON (its SHA-256 must equal vars.SCAN_REPORT_SOURCES_SHA256)
        required: false
        default: ""
        type: string
      prepared_json:
        description: Reviewed output-only local candidate import JSON (SHA-256 must equal vars.SCAN_REPORT_PREPARED_SHA256)
        required: false
        default: ""
        type: string
permissions: {}
concurrency:
  group: scan-report-candidate-upload
  cancel-in-progress: false
jobs:
  candidate:
    if: github.event.repository.visibility == 'public' && github.event_name == 'workflow_dispatch' && github.repository == 'samartomar/aih-scan' && github.repository_id == '1336836161' && github.repository_owner_id == '9993940' && github.ref == 'refs/heads/main' && github.workflow_ref == 'samartomar/aih-scan/.github/workflows/scan-report-candidate-upload.yml@refs/heads/main' && github.sha == vars.SCAN_REPORT_REVIEWED_HEAD && github.actor == 'samartomar' && github.actor_id == '9993940' && github.triggering_actor == 'samartomar' && github.run_attempt == '1' && ((inputs.sources_json != '' && inputs.prepared_json == '' && vars.SCAN_REPORT_SOURCES_SHA256 != '') || (inputs.prepared_json != '' && inputs.sources_json == '' && vars.SCAN_REPORT_PREPARED_SHA256 != '')) && (inputs.producer_json == '' || inputs.prepared_json != '') && ((inputs.producer_json == '' && vars.SCAN_REPORT_PRODUCER_SHA256 == '') || (inputs.producer_json != '' && vars.SCAN_REPORT_PRODUCER_SHA256 != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: inputs.prepared_json == ''
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        if: inputs.prepared_json == ''
        with:
          version: 0.12.13
      - name: Validate the reviewed sources
        if: inputs.prepared_json == ''
        env:
          SOURCES_JSON: ${{ inputs.sources_json }}
          SOURCES_SHA256: ${{ vars.SCAN_REPORT_SOURCES_SHA256 }}
        run: |-
          set -euo pipefail
          printf '%s' "$SOURCES_JSON" > "$RUNNER_TEMP/sources.json"
          node tools/publisher/candidate.mjs sources "$RUNNER_TEMP/sources.json" "$SOURCES_SHA256" > "$RUNNER_TEMP/targets.json"
      - name: Pack and install the exact scanner in a fresh consumer
        run: |-
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
          mkdir "$RUNNER_TEMP/scanner" "$RUNNER_TEMP/consumer"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/scanner" > "$RUNNER_TEMP/pack.json"
          tarball="$RUNNER_TEMP/scanner/$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0].filename' "$RUNNER_TEMP/pack.json")"
          cd "$RUNNER_TEMP/consumer"
          printf '{"name":"scan-report-consumer","version":"0.0.0","private":true,"type":"module"}\n' > package.json
          npm install --ignore-scripts --no-audit --no-fund --save-exact "$tarball"
          sha256sum "$tarball" | awk '{print $1}' > "$RUNNER_TEMP/scanner/tarball.sha256"
      - name: Validate the independent reviewed producer context
        if: inputs.producer_json != '' && inputs.prepared_json != ''
        id: producer
        env:
          PRODUCER_JSON: ${{ inputs.producer_json }}
          PRODUCER_SHA256: ${{ vars.SCAN_REPORT_PRODUCER_SHA256 }}
        run: |-
          set -euo pipefail
          printf '%s' "$PRODUCER_JSON" > "$RUNNER_TEMP/producer.json"
          echo "source_commit=$(node tools/publisher/candidate.mjs producer-source "$RUNNER_TEMP/producer.json" "$PRODUCER_SHA256")" >> "$GITHUB_OUTPUT"
      - name: Check out only the independently reviewed producer source
        if: inputs.producer_json != '' && inputs.prepared_json != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.producer.outputs.source_commit }}
          path: reviewed-producer
          persist-credentials: false
      - name: Build the isolated producer with its exact reviewed lock and package
        if: inputs.producer_json != '' && inputs.prepared_json != ''
        env:
          PRODUCER_SHA256: ${{ vars.SCAN_REPORT_PRODUCER_SHA256 }}
        run: |-
          set -euo pipefail
          node tools/publisher/candidate.mjs producer-build "$RUNNER_TEMP/producer.json" "$PRODUCER_SHA256" reviewed-producer "$RUNNER_TEMP/producer-consumer"
      - name: Provision the locked analyzer runtimes
        if: inputs.prepared_json == ''
        run: |-
          set -euo pipefail
          runtimes="$RUNNER_TEMP/analyzers"
          UV_PROJECT_ENVIRONMENT="$runtimes/skillspector" uv sync --project tools/analyzers/skillspector --locked --no-install-project --python 3.13
          UV_PROJECT_ENVIRONMENT="$runtimes/cisco-skill-scanner" uv sync --project tools/analyzers/cisco-skill-scanner --locked --no-install-project --python 3.13
      - name: Scan every reviewed source with the installed CLI
        if: inputs.prepared_json == ''
        env:
          AIH_SCAN_SKILLSPECTOR: ${{ runner.temp }}/analyzers/skillspector/bin/skillspector
          AIH_SCAN_SKILL_SCANNER: ${{ runner.temp }}/analyzers/cisco-skill-scanner/bin/skill-scanner
        run: |-
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate"
          mkdir -p "$candidate/targets"
          cli="$RUNNER_TEMP/consumer/node_modules/.bin/aih-scan"
          count="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).length' "$RUNNER_TEMP/targets.json")"
          for ((index = 0; index < count; index++)); do
            target="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[Number(process.argv[2])].target' "$RUNNER_TEMP/targets.json" "$index")"
            ref="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[Number(process.argv[2])].ref ?? ""' "$RUNNER_TEMP/targets.json" "$index")"
            args=(scan "$target" --origin published --json --out "$candidate/targets/$index")
            if [ -n "$ref" ]; then args+=(--ref "$ref"); fi
            "$cli" "${args[@]}" > "$candidate/targets/$index.result.json"
          done
          cp "$RUNNER_TEMP/sources.json" "$candidate/sources.json"
          cp "$RUNNER_TEMP/scanner/tarball.sha256" "$candidate/scanner-tarball.sha256"
      - name: Import and validate reviewed local AI outputs without rerunning their analysis
        if: inputs.prepared_json != ''
        env:
          PREPARED_JSON: ${{ inputs.prepared_json }}
          PREPARED_SHA256: ${{ vars.SCAN_REPORT_PREPARED_SHA256 }}
          PRODUCER_SHA256: ${{ vars.SCAN_REPORT_PRODUCER_SHA256 }}
        run: |-
          set -euo pipefail
          printf '%s' "$PREPARED_JSON" > "$RUNNER_TEMP/prepared-import.json"
          consumer="$RUNNER_TEMP/consumer"
          producer_args=()
          if [ -n "$PRODUCER_SHA256" ]; then
            consumer="$RUNNER_TEMP/producer-consumer"
            producer_args=("$RUNNER_TEMP/producer.json" "$PRODUCER_SHA256")
          fi
          node tools/publisher/candidate.mjs prepared-import "$RUNNER_TEMP/prepared-import.json" "$PREPARED_SHA256" "$consumer" "$RUNNER_TEMP/candidate" "${producer_args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scan-report-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
