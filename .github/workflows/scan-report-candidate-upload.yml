name: One-shot reviewed Scan candidate upload
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: scan-report-candidate-upload
  cancel-in-progress: false
jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'samartomar/aih-scan' && github.repository_id == '1336836161' && github.repository_owner_id == '9993940' && github.ref == 'refs/heads/main' && github.workflow_ref == 'samartomar/aih-scan/.github/workflows/scan-report-candidate-upload.yml@refs/heads/main' && github.sha == vars.SCAN_REPORT_REVIEWED_HEAD && github.actor == 'stomar-tech' && github.actor_id == '333589491' && github.triggering_actor == 'stomar-tech' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - name: Materialize only exact reviewed data
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdirSync, writeFileSync } from 'node:fs';
          const inputs = [
            ['artifact.json', '', 5585, 'bac82f592646ca58eaea3eb38c9f48ddd430f4440612ba7ef76a908552d61634'],
            ['statement.json', '', 483, '15844fd0e376154a85a52fc8eb7a6c1b5b1fe906deb62408c2e222afe4cb5e33'],
          ];
          mkdirSync('candidate', { mode: 0o700 });
          for (const [name, encoded, length, digest] of inputs) {
            const bytes = Buffer.from(encoded, 'base64');
            if (bytes.length !== length || createHash('sha256').update(bytes).digest('hex') !== digest)
              throw new Error('Reviewed data mismatch');
            writeFileSync(`candidate/${name}`, bytes, { flag: 'wx', mode: 0o600 });
          }
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: unsigned
        with:
          name: scan-unsigned-artifact
          path: candidate/artifact.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: statement
        with:
          name: scan-detached-statement
          path: candidate/statement.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30