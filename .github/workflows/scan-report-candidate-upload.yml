name: Frozen Scan production refresh
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Freeze and review before running pinned source data
        required: true
        type: choice
        options:
          - freeze
          - run
      input_json:
        description: Exact reviewed input JSON bytes; freeze only
        required: false
        type: string
permissions: {}
concurrency:
  group: scan-report-candidate-upload
  cancel-in-progress: false
jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'samartomar/aih-scan' && github.repository_id == '1336836161' && github.repository_owner_id == '9993940' && github.ref == 'refs/heads/main' && github.workflow_ref == 'samartomar/aih-scan/.github/workflows/scan-report-candidate-upload.yml@refs/heads/main' && github.sha == vars.SCAN_REPORT_REVIEWED_HEAD && github.actor == 'stomar-tech' && github.actor_id == '333589491' && github.triggering_actor == 'stomar-tech' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts && npm run build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
        if: ${{ inputs.phase == 'run' }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: 0.12.13
        if: ${{ inputs.phase == 'run' }}
      - name: Prepare fixed Linux namespace runtime
        run: |-
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor apparmor-profiles bubblewrap
          sudo apparmor_parser --replace /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          python_prefix="$(python3.13 -c 'import sys; print(sys.prefix)')"
          case "$python_prefix" in /usr|/usr/*) exit 1;; esac
          sudo cp -a "${python_prefix}/." /usr/local/
          sudo install -m 0644 "${python_prefix}/lib/libpython3.13.so.1.0" /usr/lib/x86_64-linux-gnu/libpython3.13.so.1.0
          sudo install -m 0755 "$(command -v uv)" /usr/local/bin/uv
          sudo ln -sf /usr/local/bin/python3.13 /usr/bin/python3.13
        if: ${{ inputs.phase == 'run' }}
      - name: Freeze reviewed input with a packed installed scanner
        if: ${{ inputs.phase == 'freeze' }}
        env:
          INPUT_JSON: ${{ inputs.input_json }}
          INPUT_SHA: ${{ vars.SCAN_REFRESH_INPUT_SHA256 }}
        run: |-
          set -euo pipefail
          mkdir "$RUNNER_TEMP/frozen"
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {canonicalBytes,parseJson,sha256,validateInput} from './tools/refresh/contracts.mjs';
          const bytes=Buffer.from(process.env.INPUT_JSON,'utf8');
          if(sha256(bytes)!==process.env.INPUT_SHA)throw Error('Reviewed input digest mismatch');
          const input=validateInput(parseJson(bytes));
          if(input.scannerSourceCommit!==process.env.GITHUB_SHA||!canonicalBytes(input.runtime).equals(canonicalBytes({node:process.version,platform:process.platform,architecture:process.arch})))throw Error('Frozen source or runtime mismatch');
          writeFileSync(process.env.RUNNER_TEMP+'/input.json',bytes,{flag:'wx'});
          NODE
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/frozen" > "$RUNNER_TEMP/pack.json"
          node --input-type=module <<'NODE'
          import {readFileSync,renameSync,writeFileSync,mkdirSync} from 'node:fs';
          const dir=process.env.RUNNER_TEMP+'/frozen',file=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/pack.json'))[0].filename;
          renameSync(dir+'/'+file,dir+'/scanner.tgz');mkdirSync(dir+'/consumer');writeFileSync(dir+'/consumer/package.json',JSON.stringify({name:'scan-refresh-consumer',version:'0.0.0',private:true,type:'module'}),{flag:'wx'});
          NODE
          (cd "$RUNNER_TEMP/frozen/consumer" && npm install --ignore-scripts --no-audit --no-fund --save-exact ../scanner.tgz)
          node tools/refresh/refresh.mjs freeze --input "$RUNNER_TEMP/input.json" --scanner-tgz "$RUNNER_TEMP/frozen/scanner.tgz" --scanner-install "$RUNNER_TEMP/frozen/consumer" --out "$RUNNER_TEMP/frozen/manifest.json"
          node tools/artifact/refresh-publication.mjs retain "$RUNNER_TEMP/frozen" "$RUNNER_TEMP/frozen/scanner.tgz" "$RUNNER_TEMP/frozen/consumer"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scan-refresh-frozen
          path: |-
            ${{ runner.temp }}/frozen/manifest.json
            ${{ runner.temp }}/frozen/scanner.tgz
            ${{ runner.temp }}/frozen/consumer-package-lock.json
            ${{ runner.temp }}/frozen/custody.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
        if: ${{ inputs.phase == 'freeze' }}
      - name: Verify independently selected freeze run before downloading data
        if: ${{ inputs.phase == 'run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ vars.SCAN_REFRESH_FROZEN_RUN_ID }}
          ARCHIVE_ID: ${{ vars.SCAN_REFRESH_FROZEN_ARTIFACT_ID }}
          ARCHIVE_DIGEST: ${{ vars.SCAN_REFRESH_FROZEN_ARTIFACT_DIGEST }}
          HEAD: ${{ vars.SCAN_REPORT_REVIEWED_HEAD }}
        run: |-
          set -euo pipefail
          case "$RUN_ID" in ''|*[!0-9]*) exit 1;; esac
          test "${#RUN_ID}" -le 16
          gh api "repos/samartomar/aih-scan/actions/runs/$RUN_ID" > run.json
          gh api "repos/samartomar/aih-scan/actions/runs/$RUN_ID/artifacts?per_page=100" > archives.json
          node tools/artifact/check-refresh-run.mjs run.json archives.json "$RUN_ID" "$HEAD" "$ARCHIVE_ID" "$ARCHIVE_DIGEST" scan-refresh-frozen
      - if: ${{ inputs.phase == 'run' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ vars.SCAN_REFRESH_FROZEN_ARTIFACT_ID }}
          digest-mismatch: error
          run-id: ${{ vars.SCAN_REFRESH_FROZEN_RUN_ID }}
          github-token: ${{ github.token }}
          path: frozen
      - name: Execute frozen batch serially; retain truthful partial and diagnostic rows
        if: ${{ inputs.phase == 'run' }}
        env:
          MANIFEST_SHA: ${{ vars.SCAN_REPORT_MANIFEST_SHA256 }}
        run: |-
          set -euo pipefail
          node tools/artifact/install-retained-scanner.mjs frozen "$MANIFEST_SHA" "$RUNNER_TEMP/scanner-work/consumer"
          set +e
          node tools/refresh/refresh.mjs run --manifest frozen/manifest.json --scanner-tgz frozen/scanner.tgz --scanner-install "$RUNNER_TEMP/scanner-work/consumer" --out "$RUNNER_TEMP/candidate"
          status=$?
          set -e
          case "$status" in 0|1) ;; *) exit "$status";; esac
          node tools/artifact/refresh-publication.mjs retain "$RUNNER_TEMP/candidate" frozen/scanner.tgz "$RUNNER_TEMP/scanner-work/consumer"
          node tools/artifact/refresh-publication.mjs check "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/scanner-work/consumer" "$MANIFEST_SHA" "$RUNNER_TEMP/selection.json" transport
          printf 'Producer coverage exit: %s; see every terminal row in inventory.json.\n' "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scan-refresh-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
        if: ${{ inputs.phase == 'run' }}
      - id: failure-evidence
        name: Retain bounded NONPUBLISHABLE original failure evidence
        if: ${{ failure() && inputs.phase == 'run' }}
        run: node tools/artifact/retain-failure-evidence.mjs "$RUNNER_TEMP/candidate" frozen "$RUNNER_TEMP/failure-evidence"
      - name: Upload NONPUBLISHABLE failure root
        if: ${{ failure() && inputs.phase == 'run' && steps.failure-evidence.outputs.root == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scan-refresh-NONPUBLISHABLE-root
          path: ${{ runner.temp }}/failure-evidence/root/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload NONPUBLISHABLE failure mattpocock--skills
        if: ${{ failure() && inputs.phase == 'run' && steps.failure-evidence.outputs.target_0 == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scan-refresh-NONPUBLISHABLE-mattpocock--skills
          path: ${{ runner.temp }}/failure-evidence/targets/mattpocock--skills/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload NONPUBLISHABLE failure affaan-m--ECC
        if: ${{ failure() && inputs.phase == 'run' && steps.failure-evidence.outputs.target_1 == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scan-refresh-NONPUBLISHABLE-affaan-m--ECC
          path: ${{ runner.temp }}/failure-evidence/targets/affaan-m--ECC/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload NONPUBLISHABLE failure anthropics--skills
        if: ${{ failure() && inputs.phase == 'run' && steps.failure-evidence.outputs.target_2 == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scan-refresh-NONPUBLISHABLE-anthropics--skills
          path: ${{ runner.temp }}/failure-evidence/targets/anthropics--skills/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload NONPUBLISHABLE failure obra--superpowers
        if: ${{ failure() && inputs.phase == 'run' && steps.failure-evidence.outputs.target_3 == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scan-refresh-NONPUBLISHABLE-obra--superpowers
          path: ${{ runner.temp }}/failure-evidence/targets/obra--superpowers/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload NONPUBLISHABLE failure nextlevelbuilder--ui-ux-pro-max-skill
        if: ${{ failure() && inputs.phase == 'run' && steps.failure-evidence.outputs.target_4 == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scan-refresh-NONPUBLISHABLE-nextlevelbuilder--ui-ux-pro-max-skill
          path: ${{ runner.temp }}/failure-evidence/targets/nextlevelbuilder--ui-ux-pro-max-skill/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload NONPUBLISHABLE failure DietrichGebert--ponytail
        if: ${{ failure() && inputs.phase == 'run' && steps.failure-evidence.outputs.target_5 == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scan-refresh-NONPUBLISHABLE-DietrichGebert--ponytail
          path: ${{ runner.temp }}/failure-evidence/targets/DietrichGebert--ponytail/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload NONPUBLISHABLE failure samartomar--aih-extensions
        if: ${{ failure() && inputs.phase == 'run' && steps.failure-evidence.outputs.target_6 == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scan-refresh-NONPUBLISHABLE-samartomar--aih-extensions
          path: ${{ runner.temp }}/failure-evidence/targets/samartomar--aih-extensions/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
