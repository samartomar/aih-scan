name: Cisco Linux amd64 candidate evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out aih-scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact uv 0.12.5
        shell: bash
        run: |
          set -euo pipefail
          wheel="$RUNNER_TEMP/uv-0.12.5-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          curl --fail --location --silent --show-error --output "$wheel" "https://files.pythonhosted.org/packages/93/22/dacc9a0bc8604187a1ba954a3aef8329e4104eb0af772d2c3c634893bd9b/uv-0.12.5-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          echo "3e195ccf1ed60c8bb24a6447ce306441a4181d54b602407e09bc56e963911c15  $wheel" | sha256sum -c -
          python -m pip install --no-deps "$wheel"
          test "$(python -c "from importlib.metadata import version; print(version('uv'))")" = "0.12.5"
          python -m uv --version >/dev/null

      - name: Install aih-scan test dependencies
        shell: bash
        run: npm ci --ignore-scripts

      - name: Prepare controlled probe environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aih-scan-cisco-artifacts"
          mkdir -p "$RUNNER_TEMP/aih-scan-cisco-child-bin"
          mkdir -p "$RUNNER_TEMP/aih-scan-cisco-child-home"
          mkdir -p "$RUNNER_TEMP/aih-scan-cisco-uv-cache"
          : > "$RUNNER_TEMP/aih-scan-cisco-empty-uv.toml"
          ln -s "$(command -v uv)" "$RUNNER_TEMP/aih-scan-cisco-child-bin/uv"

      - name: Verify exact runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          runtime="tools/baseline-analyzers/cisco-skill-scanner"
          wheel="$RUNNER_TEMP/cisco_ai_skill_scanner-2.1.0-cp311.cp312.cp313.cp314-none-manylinux_2_17_x86_64.whl"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/cisco_ai_skill_scanner-2.1.0-cp311.cp312.cp313.cp314-none-manylinux_2_17_x86_64.whl" "https://files.pythonhosted.org/packages/ff/be/5b468d653ece56ab24497b6bb308e0487cc6b4b1b77bb1ebd4b5eb26a19c/cisco_ai_skill_scanner-2.1.0-cp311.cp312.cp313.cp314-none-manylinux_2_17_x86_64.whl"
          cat > "$RUNNER_TEMP/cisco-runtime-inputs.sha256" <<EOF
          35de8ad9e2d243fb418f8dbeba2f55c4a430495fe1c7163a21809f0ea3999ead  $runtime/pyproject.toml
          1e98c5679994dc56f82c1d88a77528d4c4b076160aff85b4d97ce239360bc210  $runtime/uv.lock
          c84292b720bf0eddc8913fe3017dcdb05bd7e98eb19f6ee61dee2c4eb9fa901e  $RUNNER_TEMP/cisco_ai_skill_scanner-2.1.0-cp311.cp312.cp313.cp314-none-manylinux_2_17_x86_64.whl
          EOF
          sha256sum -c "$RUNNER_TEMP/cisco-runtime-inputs.sha256"

      - name: Warm exact Cisco runtime
        shell: bash
        run: |
          set -euo pipefail
          UV_CACHE_DIR="$RUNNER_TEMP/aih-scan-cisco-uv-cache" HOME="$RUNNER_TEMP/aih-scan-cisco-child-home" UV_CONFIG_FILE="$RUNNER_TEMP/aih-scan-cisco-empty-uv.toml" uv sync --project tools/baseline-analyzers/cisco-skill-scanner --locked --isolated --python 3.12

      - name: Capture Linux observation evidence
        shell: bash
        run: |
          set -euo pipefail
          export AIH_SCAN_CISCO_LINUX_AMD64_PROBE=1
          export UV_OFFLINE=1
          export AIH_SCAN_CISCO_RUNTIME_PROJECT="$GITHUB_WORKSPACE/tools/baseline-analyzers/cisco-skill-scanner"
          export AIH_SCAN_CISCO_ARTIFACT_DIR="$RUNNER_TEMP/aih-scan-cisco-artifacts"
          export AIH_SCAN_CISCO_CHILD_PATH="$RUNNER_TEMP/aih-scan-cisco-child-bin"
          export AIH_SCAN_CISCO_CHILD_HOME="$RUNNER_TEMP/aih-scan-cisco-child-home"
          export AIH_SCAN_CISCO_CHILD_UV_CACHE_DIR="$RUNNER_TEMP/aih-scan-cisco-uv-cache"
          npm test -- --run tests/cisco/linux-amd64-probe.test.ts --testTimeout=130000

      - name: Upload sanitized observation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cisco-linux-amd64-candidate-evidence
          path: |
            ${{ runner.temp }}/aih-scan-cisco-artifacts/sanitized-sarif-*.json
            ${{ runner.temp }}/aih-scan-cisco-artifacts/sanitized-runner-failure-*.json
            ${{ runner.temp }}/aih-scan-cisco-artifacts/sanitized-observation-summary.json
          if-no-files-found: warn
          retention-days: 3
