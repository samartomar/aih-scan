# One-use recovery for the GitHub Release evidence omitted after the authorized
# v-scan-0.1.1 npm publication. It accepts only the retained original run
# artifact and exact public npm/tag observations. The protected job executes no
# Scanner package code and cannot publish to npm.
name: recover v-scan-0.1.1 Release evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-v-scan-0.1.1
  cancel-in-progress: false

env:
  RELEASE_TAG: v-scan-0.1.1
  RELEASE_SHA: a1f3541cf36af7a128d4ce4554a4b6bbc3d53fa8
  SOURCE_RUN_ID: "32876377673"
  SOURCE_ARTIFACT_ID: "9574045679"
  SOURCE_ARTIFACT_NAME: scan-release-32876377673-1
  SOURCE_ARTIFACT_DIGEST: sha256:16edeb32b197f2d42b40d9b2a9e96cbbf0ef85b847f0cde609d4e7dd1dbf8410
  TARBALL: aihq-scan-0.1.1.tgz
  TARBALL_SHA256: ac80c7a2254d796aa30e489f6c3b7c2b72afa1194a3e5ed9e31a128b8e7ae8ec
  TARBALL_SHA1: cccb6bb5b1a2a2b9c434e6468c25165a83e66f94
  TARBALL_INTEGRITY: sha512-NZchLJPGwVWY1V5U8GMei8Nts7g+wDcIPNmC4e6/bIV3p1JoktLc0TK0pLR/NTDtJ8J9DKlrv9XSON0yalmLXw==

jobs:
  verify-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_sha256: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Assert recovery workflow is current main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          observation_root="$(mktemp -d)"
          git -C "$observation_root" init --bare
          git -C "$observation_root" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$observation_root" fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          main_sha="$(git -C "$observation_root" rev-parse refs/remotes/origin/main)"
          test "$GITHUB_SHA" = "$main_sha"
      - name: Validate retained source artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_observation="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID")"
          ARTIFACT_OBSERVATION="$artifact_observation" node --input-type=module <<'NODE'
          const value = JSON.parse(process.env.ARTIFACT_OBSERVATION ?? "");
          const run = value?.workflow_run;
          if (
            typeof value !== "object" ||
            value === null ||
            Array.isArray(value) ||
            value.id !== 9574045679 ||
            value.name !== "scan-release-32876377673-1" ||
            value.expired !== false ||
            value.digest !== "sha256:16edeb32b197f2d42b40d9b2a9e96cbbf0ef85b847f0cde609d4e7dd1dbf8410" ||
            typeof run !== "object" ||
            run === null ||
            Array.isArray(run) ||
            run.id !== 32876377673 ||
            run.head_sha !== "a1f3541cf36af7a128d4ce4554a4b6bbc3d53fa8" ||
            run.head_branch !== "v-scan-0.1.1"
          ) {
            throw new Error("retained release artifact metadata is not the authorized source");
          }
          NODE
      - name: Download retained exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: samartomar/aih-scan
          run-id: 32876377673
          artifact-ids: 9574045679
          path: .
          digest-mismatch: error
      - name: Validate retained tarball identity and bytes
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#files[@]}" -ne 1 ] || [ "${files[0]}" != "$TARBALL" ]; then
            echo "::error::retained artifact must contain only $TARBALL"
            exit 1
          fi
          actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          actual_sha1="$(sha1sum "$TARBALL" | awk '{print $1}')"
          actual_integrity="sha512-$(node --input-type=module - "$TARBALL" <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          process.stdout.write(createHash("sha512").update(readFileSync(process.argv[2])).digest("base64"));
          NODE
          )"
          test "$actual_sha256" = "$TARBALL_SHA256"
          test "$actual_sha1" = "$TARBALL_SHA1"
          test "$actual_integrity" = "$TARBALL_INTEGRITY"
          node --input-type=module - "$TARBALL" <<'NODE'
          import { execFileSync } from "node:child_process";

          const tarball = process.argv[2];
          const entries = execFileSync("tar", ["-tzf", tarball], { encoding: "utf8" })
            .split(/\r?\n/u)
            .filter(Boolean);
          if (
            entries.length === 0 ||
            entries.filter((entry) => entry === "package/package.json").length !== 1 ||
            entries.some(
              (entry) =>
                entry.startsWith("/") ||
                entry.includes("\\") ||
                entry.split("/").some((part) => part === "." || part === ".."),
            )
          ) {
            throw new Error("retained tarball has an unsafe or ambiguous archive layout");
          }
          const manifest = JSON.parse(
            execFileSync("tar", ["-xOf", tarball, "package/package.json"], { encoding: "utf8" }),
          );
          const publishConfig = manifest.publishConfig;
          if (
            manifest.name !== "@aihq/scan" ||
            manifest.version !== "0.1.1" ||
            typeof publishConfig !== "object" ||
            publishConfig === null ||
            Array.isArray(publishConfig) ||
            Object.keys(publishConfig).length !== 1 ||
            publishConfig.access !== "public"
          ) {
            throw new Error("retained tarball manifest is not exact @aihq/scan@0.1.1");
          }
          NODE
      - name: Validate public npm identity and provenance
        run: |
          set -euo pipefail
          npm_observation="$(npm view "@aihq/scan@0.1.1" name version dist --json --registry "https://registry.npmjs.org/" --loglevel silent)"
          NPM_OBSERVATION="$npm_observation" \
          EXPECTED_SHA1="$TARBALL_SHA1" \
          EXPECTED_INTEGRITY="$TARBALL_INTEGRITY" \
          node --input-type=module <<'NODE'
          const value = JSON.parse(process.env.NPM_OBSERVATION ?? "");
          const expectedTopKeys = ["dist", "name", "version"];
          const dist = value?.dist;
          const signatures = dist?.signatures;
          if (
            typeof value !== "object" ||
            value === null ||
            Array.isArray(value) ||
            JSON.stringify(Object.keys(value).sort()) !== JSON.stringify(expectedTopKeys) ||
            value.name !== "@aihq/scan" ||
            value.version !== "0.1.1" ||
            typeof dist !== "object" ||
            dist === null ||
            Array.isArray(dist) ||
            dist.shasum !== process.env.EXPECTED_SHA1 ||
            dist.integrity !== process.env.EXPECTED_INTEGRITY ||
            dist.tarball !== "https://registry.npmjs.org/@aihq/scan/-/scan-0.1.1.tgz" ||
            dist.attestations?.provenance?.predicateType !== "https://slsa.dev/provenance/v1" ||
            !Array.isArray(signatures) ||
            signatures.length === 0 ||
            signatures.some(
              (signature) =>
                typeof signature !== "object" ||
                signature === null ||
                Array.isArray(signature) ||
                typeof signature.keyid !== "string" ||
                signature.keyid.length === 0 ||
                typeof signature.sig !== "string" ||
                signature.sig.length === 0,
            )
          ) {
            throw new Error("npm does not serve the exact published Scanner artifact with provenance");
          }
          NODE
      - name: Verify original GitHub build attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow samartomar/aih-scan/.github/workflows/release.yml \
            --source-ref refs/tags/v-scan-0.1.1 \
            --source-digest a1f3541cf36af7a128d4ce4554a4b6bbc3d53fa8 \
            --deny-self-hosted-runners
      - name: Validate immutable tag and missing Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          observation_root="$(mktemp -d)"
          git -C "$observation_root" init --bare
          git -C "$observation_root" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$observation_root" fetch --no-tags origin \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_sha="$(git -C "$observation_root" rev-parse "refs/tags/$RELEASE_TAG^{}")"
          test "$tag_sha" = "$RELEASE_SHA"
          release_body="$(mktemp)"
          release_status="$(curl --silent --show-error --output "$release_body" --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$release_status" = "404"
          node --input-type=module - "$release_body" <<'NODE'
          import { readFileSync } from "node:fs";
          const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (
            typeof value !== "object" ||
            value === null ||
            Array.isArray(value) ||
            value.message !== "Not Found" ||
            value.status !== "404"
          ) {
            throw new Error("GitHub did not return an exact missing-Release observation");
          }
          NODE
      - name: Carry exact retained tarball into the protected recovery job
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-release-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: aihq-scan-0.1.1.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  recover-release:
    needs: verify-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm-publish
      url: https://github.com/samartomar/aih-scan/releases/tag/v-scan-0.1.1
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      RECOVERY_ARTIFACT_ID: ${{ needs.verify-recovery.outputs.artifact_id }}
      RECOVERY_ARTIFACT_DIGEST: ${{ needs.verify-recovery.outputs.artifact_sha256 }}
    steps:
      - name: Download verified recovery candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-recovery.outputs.artifact_id }}
          path: .
          digest-mismatch: error
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Revalidate recovery artifact custody
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$RECOVERY_ARTIFACT_ID" in
            ''|*[!0-9]*) echo "::error::invalid recovery artifact id"; exit 1 ;;
          esac
          if ! [[ "$RECOVERY_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::invalid recovery artifact digest"
            exit 1
          fi
          expected_api_digest="sha256:$RECOVERY_ARTIFACT_DIGEST"
          api_digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECOVERY_ARTIFACT_ID" --jq .digest)"
          test "$api_digest" = "$expected_api_digest"
          test -f "$TARBALL"
          actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          test "$actual_sha256" = "$TARBALL_SHA256"
      - name: Revalidate original artifact and npm provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" --jq .digest)"
          source_expired="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" --jq .expired)"
          test "$source_digest" = "$SOURCE_ARTIFACT_DIGEST"
          test "$source_expired" = "false"
          gh attestation verify "$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow samartomar/aih-scan/.github/workflows/release.yml \
            --source-ref refs/tags/v-scan-0.1.1 \
            --source-digest a1f3541cf36af7a128d4ce4554a4b6bbc3d53fa8 \
            --deny-self-hosted-runners
      - name: Generate tarball-scoped SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: aih-scan-sbom.spdx.json
          file: "${{ env.TARBALL }}"
          format: spdx-json
          output-file: aih-scan-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Validate tarball-scoped SPDX SBOM
        run: |
          set -euo pipefail
          SBOM_PATH=aih-scan-sbom.spdx.json \
          EXPECTED_TARBALL="$TARBALL" \
          EXPECTED_SHA256="$TARBALL_SHA256" \
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const sbom = JSON.parse(readFileSync(process.env.SBOM_PATH ?? "", "utf8"));
          const expectedTarball = process.env.EXPECTED_TARBALL;
          const expectedSha256 = process.env.EXPECTED_SHA256;
          const packages = sbom?.packages;
          const exactTarballPackages = Array.isArray(packages)
            ? packages.filter(
                (pkg) =>
                  typeof pkg?.name === "string" &&
                  (pkg.name === expectedTarball ||
                    pkg.name.endsWith(`/${expectedTarball}`) ||
                    pkg.name.endsWith(`\\${expectedTarball}`)) &&
                  pkg.versionInfo === `sha256:${expectedSha256}` &&
                  Array.isArray(pkg.checksums) &&
                  pkg.checksums.length === 1 &&
                  pkg.checksums[0]?.algorithm === "SHA256" &&
                  pkg.checksums[0]?.checksumValue === expectedSha256,
              )
            : [];
          if (
            typeof sbom !== "object" ||
            sbom === null ||
            Array.isArray(sbom) ||
            typeof sbom.spdxVersion !== "string" ||
            !/^SPDX-\d+\.\d+$/u.test(sbom.spdxVersion) ||
            typeof sbom.SPDXID !== "string" ||
            sbom.SPDXID.length === 0 ||
            typeof sbom.name !== "string" ||
            sbom.name.length === 0 ||
            typeof sbom.documentNamespace !== "string" ||
            sbom.documentNamespace.length === 0 ||
            !Array.isArray(packages) ||
            packages.length !== 1 ||
            exactTarballPackages.length !== 1
          ) {
            throw new Error("recovery SBOM is not exact SPDX evidence for the retained tarball");
          }
          NODE
      - name: Download original provenance bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          provenance_root="$(mktemp -d)"
          (
            cd "$provenance_root"
            gh attestation download "$GITHUB_WORKSPACE/$TARBALL" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://slsa.dev/provenance/v1
          )
          bundle="$provenance_root/sha256:${TARBALL_SHA256}.jsonl"
          test -s "$bundle"
          PROVENANCE_BUNDLE="$bundle" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const lines = readFileSync(process.env.PROVENANCE_BUNDLE ?? "", "utf8")
            .split(/\r?\n/u)
            .filter((line) => line.length > 0);
          if (lines.length !== 1) {
            throw new Error("original provenance bundle is ambiguous");
          }
          const bundle = JSON.parse(lines[0]);
          if (typeof bundle !== "object" || bundle === null || Array.isArray(bundle)) {
            throw new Error("original provenance bundle is malformed");
          }
          NODE
          verified_provenance="$(mktemp)"
          gh attestation verify "$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$bundle" \
            --signer-workflow samartomar/aih-scan/.github/workflows/release.yml \
            --source-ref refs/tags/v-scan-0.1.1 \
            --source-digest a1f3541cf36af7a128d4ce4554a4b6bbc3d53fa8 \
            --deny-self-hosted-runners \
            --format json > "$verified_provenance"
          PROVENANCE_VERIFICATION="$verified_provenance" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const verified = JSON.parse(readFileSync(process.env.PROVENANCE_VERIFICATION ?? "", "utf8"));
          if (!Array.isArray(verified) || verified.length !== 1) {
            throw new Error("original provenance verification is ambiguous");
          }
          NODE
          cp "$bundle" provenance.intoto.jsonl
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksum and create recovered immutable GitHub Release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_live_tag() {
            test "$GITHUB_REF" = "refs/heads/main"
            observation_root="$(mktemp -d)"
            git -C "$observation_root" init --bare
            git -C "$observation_root" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
            git -C "$observation_root" fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            main_sha="$(git -C "$observation_root" rev-parse refs/remotes/origin/main)"
            tag_sha="$(git -C "$observation_root" rev-parse "refs/tags/$RELEASE_TAG^{}")"
            test "$GITHUB_SHA" = "$main_sha"
            test "$tag_sha" = "$RELEASE_SHA"
          }
          verify_npm_package() {
            npm_observation="$(npm view "@aihq/scan@0.1.1" name version dist --json --registry "https://registry.npmjs.org/" --loglevel silent)"
            NPM_OBSERVATION="$npm_observation" \
            EXPECTED_SHA1="$TARBALL_SHA1" \
            EXPECTED_INTEGRITY="$TARBALL_INTEGRITY" \
            node --input-type=module <<'NODE'
          const value = JSON.parse(process.env.NPM_OBSERVATION ?? "");
          const dist = value?.dist;
          const signatures = dist?.signatures;
          if (
            typeof value !== "object" ||
            value === null ||
            Array.isArray(value) ||
            JSON.stringify(Object.keys(value).sort()) !== JSON.stringify(["dist", "name", "version"]) ||
            value.name !== "@aihq/scan" ||
            value.version !== "0.1.1" ||
            typeof dist !== "object" ||
            dist === null ||
            Array.isArray(dist) ||
            dist.shasum !== process.env.EXPECTED_SHA1 ||
            dist.integrity !== process.env.EXPECTED_INTEGRITY ||
            dist.tarball !== "https://registry.npmjs.org/@aihq/scan/-/scan-0.1.1.tgz" ||
            dist.attestations?.provenance?.predicateType !== "https://slsa.dev/provenance/v1" ||
            !Array.isArray(signatures) ||
            signatures.length === 0 ||
            signatures.some(
              (signature) =>
                typeof signature !== "object" ||
                signature === null ||
                Array.isArray(signature) ||
                typeof signature.keyid !== "string" ||
                signature.keyid.length === 0 ||
                typeof signature.sig !== "string" ||
                signature.sig.length === 0,
            )
          ) {
            throw new Error("npm observation changed before Release recovery");
          }
          NODE
          }
          verify_release_absence() {
            release_body="$(mktemp)"
            release_status="$(curl --silent --show-error --output "$release_body" --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
            test "$release_status" = "404"
            node --input-type=module - "$release_body" <<'NODE'
          import { readFileSync } from "node:fs";
          const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (value?.message !== "Not Found" || value?.status !== "404") process.exit(1);
          NODE
          }
          verify_tarball() {
            actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
            test "$actual_sha256" = "$TARBALL_SHA256"
          }

          # Claim before the checksum-signing effect.
          verify_live_tag
          verify_npm_package
          verify_release_absence
          verify_tarball
          {
            sha256sum aih-scan-sbom.spdx.json
            sha256sum "$TARBALL"
            sha256sum provenance.intoto.jsonl
          } | LC_ALL=C sort -k2,2 > SHA256SUMS.txt
          CHECKSUMS_PATH=SHA256SUMS.txt \
          EXPECTED_TARBALL="$TARBALL" \
          EXPECTED_SHA256="$TARBALL_SHA256" \
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const expectedTarball = process.env.EXPECTED_TARBALL;
          const expectedSha256 = process.env.EXPECTED_SHA256;
          const lines = readFileSync(process.env.CHECKSUMS_PATH ?? "", "utf8")
            .split(/\r?\n/u)
            .filter((line) => line.length > 0);
          const expectedNames = [
            "aih-scan-sbom.spdx.json",
            expectedTarball,
            "provenance.intoto.jsonl",
          ];
          if (
            lines.length !== expectedNames.length ||
            lines.some((line, index) => {
              const match = /^([0-9a-f]{64})  ([A-Za-z0-9._-]+)$/u.exec(line);
              return (
                match === null ||
                match[2] !== expectedNames[index] ||
                (match[2] === expectedTarball && match[1] !== expectedSha256)
              );
            })
          ) {
            throw new Error("recovery checksum evidence is not exact for all release assets");
          }
          NODE
          cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt

          # Revalidate every live claim immediately before the Release effect.
          verify_live_tag
          verify_npm_package
          verify_release_absence
          verify_tarball
          notes="AIH Scanner evidence producer. Scanner evidence is not organization authority. Recovery workflow source $GITHUB_SHA created the missing GitHub Release from the exact retained artifact of authorized run $SOURCE_RUN_ID after npm, tag, digest, and original attestation verification. It did not republish npm or execute Scanner package code."
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes "$notes" \
            "$TARBALL" \
            SHA256SUMS.txt \
            SHA256SUMS.txt.sigstore.json \
            provenance.intoto.jsonl \
            aih-scan-sbom.spdx.json
      - name: Verify recovered GitHub Release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_root="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$release_root"
          mapfile -t assets < <(find "$release_root" -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=(
            SHA256SUMS.txt
            SHA256SUMS.txt.sigstore.json
            aih-scan-sbom.spdx.json
            aihq-scan-0.1.1.tgz
            provenance.intoto.jsonl
          )
          test "${assets[*]}" = "${expected[*]}"
          actual_sha256="$(sha256sum "$release_root/$TARBALL" | awk '{print $1}')"
          test "$actual_sha256" = "$TARBALL_SHA256"
          cmp --silent SHA256SUMS.txt "$release_root/SHA256SUMS.txt"
          (
            cd "$release_root"
            sha256sum --strict --check --status SHA256SUMS.txt
          )
          cosign verify-blob "$release_root/SHA256SUMS.txt" \
            --bundle "$release_root/SHA256SUMS.txt.sigstore.json" \
