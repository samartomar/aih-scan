[project]
name = "aih-scan-cisco-skill-scanner"
version = "0.0.0"
description = "Pinned Cisco skill-scanner 2.3.2 runtime for aih-scan (not a package)."
requires-python = ">=3.12,<3.14"
dependencies = ["cisco-ai-skill-scanner==2.3.2"]

[tool.uv]
package = false
# pcodedmp (via oletools) declares win-unicode-console on win32 but imports it only
# optionally for TTY output; the package is sdist-only. Exclude it from the lock.
override-dependencies = ["win-unicode-console; python_version < '0'"]
