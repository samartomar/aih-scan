[project]
name = "aih-cisco-skill-scanner-host-runtime"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["cisco-ai-skill-scanner==2.0.14"]

[tool.uv]
package = false
# litellm 1.92.0 publishes manylinux wheels only; 1.92.2 has the same dependencies and
# wheels for Linux, macOS and Windows, so the build-free install works on every host.
constraint-dependencies = ["litellm==1.92.2"]
# win-unicode-console publishes only an sdist. pcodedmp imports it inside try/except and
# uses it only for an interactive console, so the build-free install leaves it out.
override-dependencies = ["win-unicode-console; sys_platform == 'never'"]
